<style>
:root{
  --bg:#EEF1F8; --panel:#FFFFFF; --panel2:#F7F8FC; --edge:#CBD1E6; --field:#F1F3FA; --track:#D9DEEE; --line:rgba(150,160,200,.35);
  --ink:#171B33; --dim:#545C80; --faint:#8E95B5;
  --amber:#9A6200; --amberbg:#F2B300; --onamber:#171B33; --cyan:#007E9E; --red:#C42E4A; --green:#0F7F4C;
  --glow1:rgba(0,126,158,.08); --glow2:rgba(242,179,0,.10); --scan:rgba(0,0,0,.012);
  --display:'Chakra Petch',system-ui,sans-serif;
  --body:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121628; --panel:#1E2447; --panel2:#252C55; --edge:#343D72; --field:#151a35; --track:#2B335F; --line:rgba(120,135,200,.22);
  --ink:#EEF1FF; --dim:#9AA3D1; --faint:#5A6399;
  --amber:#FFC23D; --amberbg:#FFC23D; --onamber:#14182B; --cyan:#3DE0FF; --red:#FF4D6A; --green:#47F0A0;
  --glow1:rgba(61,224,255,.12); --glow2:rgba(255,194,61,.08); --scan:rgba(255,255,255,.018); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#121628; --panel:#1E2447; --panel2:#252C55; --edge:#343D72; --field:#151a35; --track:#2B335F; --line:rgba(120,135,200,.22);
  --ink:#EEF1FF; --dim:#9AA3D1; --faint:#5A6399;
  --amber:#FFC23D; --amberbg:#FFC23D; --onamber:#14182B; --cyan:#3DE0FF; --red:#FF4D6A; --green:#47F0A0;
  --glow1:rgba(61,224,255,.12); --glow2:rgba(255,194,61,.08); --scan:rgba(255,255,255,.018); color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;
  background-image:radial-gradient(70% 40% at 85% -5%,var(--glow1),transparent 70%),radial-gradient(60% 35% at 0% 0%,var(--glow2),transparent 70%),repeating-linear-gradient(0deg,var(--scan) 0 1px,transparent 1px 3px)}
#app{height:100%;max-width:1280px;margin:0 auto;display:flex;flex-direction:column;padding:10px 12px 10px;gap:8px}
.cut{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px))}
select{font:inherit;font-size:15.5px;font-weight:600;color:var(--ink);background:var(--field);border:1px solid var(--edge);padding:8px 30px 8px 10px;border-radius:0;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat;min-width:0;width:100%}
select:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.seg{display:flex;border:1px solid var(--edge);background:var(--field);flex-wrap:wrap}
.seg button{flex:1 1 auto;font-family:var(--display);font-weight:600;font-size:13.5px;border:0;background:transparent;color:var(--dim);padding:7px 7px;cursor:pointer;white-space:nowrap}
.seg button+button{box-shadow:-1px 0 0 var(--edge)}
.seg button.on{background:var(--amberbg);color:var(--onamber)}
.seg button:disabled{opacity:.3;cursor:default}

/* top */
.top{display:flex;gap:8px;align-items:center}
.logo{width:30px;height:30px;flex:none}
.top .gsel{flex:1;min-width:0}
.top .seg{flex:none;flex-wrap:nowrap}

/* hud */
.hud{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--edge);padding:8px 12px}
.gauge{width:104px;height:auto;display:block}
.vt{min-width:0}
.vt .st{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.15}
.vt p{margin:2px 0 0;color:var(--dim);font-size:14px;line-height:1.3}
.ok{color:var(--green)} .no{color:var(--red)}
.tg{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin-top:2px}
.tg output{font-family:var(--display);font-weight:700;font-size:22px;color:var(--amber);min-width:84px;line-height:1}
.tg output small{font-size:12px;color:var(--dim);margin-left:3px}
input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:24px;background:transparent;cursor:pointer;min-width:60px}
input[type=range]::-webkit-slider-runnable-track{height:5px;background:linear-gradient(90deg,var(--amberbg) var(--p,10%),var(--track) var(--p,10%))}
input[type=range]::-moz-range-track{height:5px;background:var(--track)}
input[type=range]::-moz-range-progress{height:5px;background:var(--amberbg)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:22px;margin-top:-9px;background:var(--ink);border:2px solid var(--amber);clip-path:polygon(50% 0,100% 25%,100% 100%,0 100%,0 25%)}
input[type=range]::-moz-range-thumb{width:14px;height:20px;background:var(--ink);border:2px solid var(--amber);border-radius:0}
.hz{grid-column:1/-1;display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}
.hz::-webkit-scrollbar{display:none}
.hz button{flex:none;font-family:var(--display);font-weight:600;font-size:13px;border:1px solid var(--edge);background:transparent;color:var(--dim);padding:4px 9px;cursor:pointer}
.hz button.on{border-color:var(--amber);color:var(--amber)}

/* tabs + panes */
.tabs{display:flex;border:1px solid var(--edge);background:var(--field)}
.tabs button{flex:1;font-family:var(--display);font-weight:600;font-size:14.5px;border:0;background:transparent;color:var(--dim);padding:9px 4px;cursor:pointer;position:relative}
.tabs button.on{color:var(--ink);background:var(--panel2)}
.tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--amberbg)}
.panes{flex:1;min-height:0;display:grid}
.pane{min-height:0;overflow-y:auto;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--edge);padding:12px;display:none;scrollbar-width:thin;scrollbar-color:var(--edge) transparent}
.pane.on{display:block}
.ph{font-family:var(--display);font-weight:600;font-size:14px;color:var(--amber);margin:0 0 8px;display:flex;align-items:center;gap:7px}
.ph::before{content:"";width:7px;height:7px;background:var(--amberbg);transform:rotate(45deg);flex:none}
.ph:not(:first-child){margin-top:16px}
.lab{display:block;font-size:13.5px;font-weight:600;color:var(--dim);margin:10px 0 4px}
.lab:first-child{margin-top:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.info{font-size:14px;color:var(--dim);line-height:1.4;margin:6px 0 0;padding:7px 9px;border-left:2px solid var(--cyan);background:rgba(61,224,255,.05)}
.info b{color:var(--ink);font-weight:600}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0;cursor:pointer;margin-top:8px}
.sw b{font-weight:600;display:block}
.sw small{color:var(--dim);font-size:13.5px;line-height:1.3;display:block}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.knob{flex:none;width:44px;height:22px;background:var(--field);border:1px solid var(--edge);position:relative}
.knob::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;background:var(--faint);transition:transform .15s}
.sw input:checked+.knob{border-color:var(--amber);background:rgba(255,194,61,.15)}
.sw input:checked+.knob::after{transform:translateX(22px);background:var(--amberbg)}
.sw input:focus-visible+.knob{outline:2px solid var(--cyan);outline-offset:2px}
.sw.dis{opacity:.4;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{font-family:var(--display);font-size:12.5px;font-weight:600;padding:3px 8px;border:1px solid var(--edge);color:var(--dim)}
.chip.hl{border-color:var(--cyan);color:var(--cyan)}
.warn{margin-top:8px;padding:7px 10px;border-left:3px solid var(--red);background:rgba(255,77,106,.08);font-size:14px;line-height:1.35}

/* settings rows */
.mh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.mh p{margin:0;color:var(--dim);font-size:13.5px;line-height:1.3}
.mb{display:flex;gap:5px;flex:none}
.mb button{font-family:var(--display);font-weight:600;font-size:12.5px;border:1px solid var(--edge);background:var(--field);color:var(--ink);padding:5px 8px;cursor:pointer}
.mb button:disabled{opacity:.35;cursor:default}
.set{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;padding:7px 2px 7px 8px;border-bottom:1px solid var(--line);border-left:3px solid transparent}
.set.ch{border-left-color:var(--amber);background:rgba(255,194,61,.05)}
.set.lock{border-left-color:var(--cyan);background:rgba(61,224,255,.06)}
.set .nm{font-weight:600;font-size:15px;line-height:1.15}
.set .nm small{display:block;font-weight:400;color:var(--dim);font-size:12.5px;margin-top:1px}
.set .val{display:flex;align-items:center;gap:7px;justify-content:flex-end}
.set .lvl{font-family:var(--display);font-weight:700;font-size:14px;min-width:66px;text-align:right;line-height:1.1}
.set .lvl s{display:block;font-weight:500;font-size:11px;color:var(--faint)}
.pips{display:flex;gap:3px}
.pips button{width:13px;height:18px;border:1px solid var(--faint);padding:0;background:transparent;cursor:pointer;transform:skewX(-14deg)}
.pips button.f{border-color:transparent}
.pips button.f{background:var(--amberbg)}
.set.lock .pips button.f{background:var(--cyan)}
.set .gain{grid-column:1/-1;font-size:12.5px;color:var(--green);font-weight:600}
.set .gain.lk{color:var(--cyan)}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--amberbg);color:var(--onamber);font-family:var(--display);font-weight:700;padding:8px 14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.toast.on{opacity:1}
.foot{font-size:12.5px;color:var(--faint);line-height:1.35;margin-top:12px}

/* app settings */
.gear{flex:none;width:38px;height:38px;border:1px solid var(--edge);background:var(--field);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.gear svg{width:20px;height:20px}
.sheet-bg{position:fixed;inset:0;background:rgba(8,10,24,.55);display:none;align-items:flex-start;justify-content:center;z-index:20;padding:calc(56px + env(safe-area-inset-top,0px)) 12px 12px}
.sheet-bg.on{display:flex}
.sheet{width:100%;max-width:380px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--edge);padding:16px;max-height:100%;overflow:auto}
.sheet .langs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
.sheet .langs button{font-family:var(--body);font-weight:600;font-size:14.5px;border:1px solid var(--edge);background:var(--field);color:var(--ink);padding:8px 4px;cursor:pointer}
.sheet .langs button.on{background:var(--amberbg);border-color:var(--amberbg);color:var(--onamber)}
.sheet .closeb{margin-top:14px;width:100%;font-family:var(--display);font-weight:700;font-size:15px;border:0;background:var(--amberbg);color:var(--onamber);padding:10px;cursor:pointer}
/* game search */
.gsearch{position:relative}
.gsearch svg{position:absolute;left:10px;top:50%;width:17px;height:17px;transform:translateY(-50%);color:var(--dim);pointer-events:none}
.gsearch input{width:100%;font:inherit;font-size:15.5px;color:var(--ink);background:var(--field);border:1px solid var(--edge);padding:9px 10px 9px 34px;border-radius:0}
#gameRes{position:absolute;left:0;right:0;top:100%;z-index:15;max-height:55vh;overflow:auto;background:var(--panel);border:1px solid var(--edge);border-top:0;box-shadow:0 10px 24px rgba(0,0,0,.35)}
#gameRes:empty{display:none}
#gameRes button{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;font:inherit;font-size:15px;font-weight:600;color:var(--ink);background:transparent;border:0;border-top:1px solid var(--line);padding:9px 11px;cursor:pointer}
#gameRes button:first-child{border-top:0}
#gameRes button:hover,#gameRes button:focus-visible,#gameRes button.act{background:var(--field)}
#gameRes small{color:var(--dim);font-weight:500;font-size:12.5px;white-space:nowrap}
#gameRes p{margin:0;padding:9px 11px;color:var(--dim);font-size:14px}

/* brand colour transition */
body,.hud,.pane,.tabs,.seg button,.set,.gear,.hz button{transition:background-color .35s ease,border-color .35s ease,color .35s ease}
@media (prefers-reduced-motion: reduce){ body,.hud,.pane,.tabs,.seg button,.set,.gear,.hz button{transition:none} }
/* notifications */
.srow{display:flex;gap:6px;align-items:stretch}
.srow .gsearch{flex:1;min-width:0}
.srow .gear{height:auto;min-height:38px}
.bell{position:relative}
.bell .dot{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--panel)}
.bell .dot[hidden]{display:none}
.bell.ring svg{animation:ring .9s ease 2}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(14deg)}40%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}80%{transform:rotate(-4deg)}}
@media (prefers-reduced-motion: reduce){ .bell.ring svg{animation:none} }
.ncard{border:1px solid var(--edge);background:var(--field);padding:10px 12px;margin-bottom:10px}
.ncard.upd{border-color:var(--amberbg)}
.ncard h3{margin:0 0 4px;font-family:var(--display);font-size:15.5px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ncard h3 small{font-family:var(--body);font-weight:500;font-size:13px;color:var(--dim)}
.ncard ul{margin:6px 0 0;padding-left:18px}
.ncard li{font-size:14.5px;line-height:1.45;margin-bottom:2px}
.ncard .new{display:inline-block;font-family:var(--display);font-size:11.5px;font-weight:700;background:var(--amberbg);color:var(--onamber);padding:1px 7px;margin-left:6px;vertical-align:2px}
.ncard button{margin-top:8px;width:100%;font-family:var(--display);font-weight:700;font-size:15px;border:0;background:var(--amberbg);color:var(--onamber);padding:9px;cursor:pointer}
.nver{font-size:13.5px;color:var(--dim);margin:0 0 10px}
.updbar{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:25;max-width:480px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 14px;background:var(--panel2);border:1px solid var(--amberbg);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.updbar[hidden]{display:none}
.updbar span{flex:1;display:flex;flex-direction:column;min-width:0}
.updbar b{font-family:var(--display);font-size:15px}
.updbar small{font-size:13px;color:var(--dim)}
.updbar button{font-family:var(--display);font-weight:700;font-size:15px;border:0;background:var(--amberbg);color:var(--onamber);padding:9px 16px;cursor:pointer}
[data-skin="cam"] .ncard,[data-skin="cam"] .updbar,[data-skin="cam"] .ncard button,[data-skin="cam"] .updbar button{border-radius:16px}
[data-skin="cam"] .updbar{-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);background:var(--panel)}
[data-skin="arena"] .ncard{border:0;border-left:4px solid var(--edge)}
[data-skin="arena"] .ncard.upd,[data-skin="arena"] .ncard.cur{border-left-color:var(--amberbg)}

/* experience mode bar */
.topcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.modebar button{font-size:14.5px;padding:9px 6px}
.modebar:empty{display:none}
.cinesum{margin:0 0 12px;padding:10px 12px;border:1px solid var(--edge);background:var(--field)}
.cinesum b{display:block;font-family:var(--display);color:var(--amber);font-size:14.5px;margin-bottom:6px}
.cinesum li{font-size:14.5px;line-height:1.45}
.cinesum ul{margin:0;padding-left:18px}
/* part search */
.psearch{margin-bottom:10px;position:relative}
.psearch input{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--field);border:1px solid var(--edge);padding:9px 10px;border-radius:0}
#partRes{display:flex;flex-direction:column;border:1px solid var(--edge);border-top:0;background:var(--panel)}
#partRes:empty{display:none}
#partRes button{display:flex;justify-content:space-between;gap:8px;text-align:left;font:inherit;font-size:14.5px;font-weight:600;color:var(--ink);background:transparent;border:0;border-top:1px solid var(--line);padding:8px 10px;cursor:pointer}
#partRes button:first-child{border-top:0}
#partRes button:hover,#partRes button:focus-visible{background:var(--field)}
#partRes small{color:var(--dim);font-weight:500;font-size:12.5px;white-space:nowrap}
#partRes p{margin:0;padding:8px 10px;color:var(--dim);font-size:14px}
/* onboarding tour */
.tour-block{position:fixed;inset:0;z-index:40;background:transparent}
.tour-spot{position:fixed;z-index:41;pointer-events:none;border:2px solid var(--amberbg);box-shadow:0 0 0 9999px rgba(6,8,20,.68);transition:all .25s ease}
.tour-spot.center{border:0;left:50%;top:50%;width:0;height:0}
.tour-pop{position:fixed;z-index:42;width:min(330px,calc(100vw - 24px));background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--edge);padding:14px 14px 12px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.tour-pop h3{font-family:var(--display);font-size:17px;margin:0 0 6px;color:var(--amber)}
.tour-pop p{margin:0;font-size:15px;line-height:1.45;color:var(--ink)}
.tour-foot{display:flex;align-items:center;gap:6px;margin-top:12px}
.tour-foot .cnt{font-family:var(--display);font-size:12.5px;color:var(--dim);margin-right:auto}
.tour-foot button{font-family:var(--display);font-weight:700;font-size:14px;border:1px solid var(--edge);background:var(--field);color:var(--ink);padding:7px 12px;cursor:pointer}
.tour-foot button.primary{background:var(--amberbg);border-color:var(--amberbg);color:var(--onamber)}
.tour-foot button.ghost{border-color:transparent;background:transparent;color:var(--dim)}
.tour-dots{display:flex;gap:4px;margin-top:10px}
.tour-dots i{width:16px;height:3px;background:var(--track)}
.tour-dots i.on{background:var(--amberbg)}
@media (prefers-reduced-motion: reduce){ .tour-spot{transition:none} }
.replay{margin-top:10px;width:100%;font-family:var(--display);font-weight:600;font-size:14px;border:1px solid var(--edge);background:var(--field);color:var(--ink);padding:9px;cursor:pointer}
/* wide: everything side by side, no tabs */
@media (min-width:920px){
  #app{padding:14px 18px}
  .top-hud{display:grid;grid-template-columns:1fr 1.25fr;gap:10px}
  .top{align-self:start}
  .tabs{display:none}
  .panes{grid-template-columns:300px 340px 1fr;gap:10px}
  .pane{display:block}
  .gauge{width:120px}
}
@media (max-width:919px){ .top-hud{display:flex;flex-direction:column;gap:8px} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }

/* ================= DESIGN SKINS ================= */
/* Arena */
:root[data-skin="arena"]{
  --bg:#FBF4F5; --panel:#FFFFFF; --panel2:#FFF8F9; --edge:#EBCDD3; --field:#F8ECEF; --track:#EFD9DE; --line:rgba(180,120,135,.28);
  --ink:#1F0A10; --dim:#6E4A53; --faint:#A88A91;
  --amber:#C3122F; --amberbg:#E0193A; --onamber:#FFFFFF; --cyan:#B35900; --red:#B3261E; --green:#12804F;
  --glow1:rgba(224,25,58,.07); --glow2:transparent; --scan:transparent; color-scheme:light; }
@media (prefers-color-scheme: dark){ :root[data-skin="arena"]:not([data-theme="light"]){
  --bg:#120A0D; --panel:#1C1115; --panel2:#24161B; --edge:#3D2229; --field:#170D11; --track:#3A2128; --line:rgba(201,163,171,.15);
  --ink:#FFF1F3; --dim:#C9A3AB; --faint:#7A5560;
  --amber:#FF3D5E; --amberbg:#FF3D5E; --onamber:#FFFFFF; --cyan:#FFB347; --red:#FF6B81; --green:#4DE3A0;
  --glow1:rgba(255,61,94,.16); --glow2:rgba(255,179,71,.05); color-scheme:dark; } }
:root[data-skin="arena"][data-theme="dark"]{
  --bg:#120A0D; --panel:#1C1115; --panel2:#24161B; --edge:#3D2229; --field:#170D11; --track:#3A2128; --line:rgba(201,163,171,.15);
  --ink:#FFF1F3; --dim:#C9A3AB; --faint:#7A5560;
  --amber:#FF3D5E; --amberbg:#FF3D5E; --onamber:#FFFFFF; --cyan:#FFB347; --red:#FF6B81; --green:#4DE3A0;
  --glow1:rgba(255,61,94,.16); --glow2:rgba(255,179,71,.05); color-scheme:dark; }

.ti{display:none}
.tabs button span{pointer-events:none}
.meter2{display:none}
.mringwrap{display:none}
[data-skin="cam"] .mringwrap{display:block}


/* ================= CAM (glass) ================= */
:root[data-skin="cam"]{
  --bg:#E9ECFF; --panel:rgba(255,255,255,.55); --panel2:rgba(255,255,255,.72); --edge:rgba(255,255,255,.85); --field:rgba(255,255,255,.5); --track:rgba(40,36,110,.13); --line:rgba(60,55,140,.12);
  --ink:#1B1A3A; --dim:#4F4D7A; --faint:#8C8AB5;
  --amber:#5B3DF5; --amberbg:#6A4CFF; --onamber:#FFFFFF; --cyan:#0A7FC0; --red:#E0245E; --green:#0E9F6E;
  --blob1:rgba(255,140,205,.75); --blob2:rgba(120,190,255,.8); --blob3:rgba(170,150,255,.75); --optbg:#FFFFFF;
  --display:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif; color-scheme:light; }
@media (prefers-color-scheme: dark){ :root[data-skin="cam"]:not([data-theme="light"]){
  --bg:#0C0A22; --panel:rgba(255,255,255,.07); --panel2:rgba(255,255,255,.11); --edge:rgba(255,255,255,.17); --field:rgba(255,255,255,.07); --track:rgba(255,255,255,.14); --line:rgba(255,255,255,.08);
  --ink:#F4F2FF; --dim:#BCB8E4; --faint:#7C78A8;
  --amber:#B3A6FF; --amberbg:#7C5CFF; --onamber:#FFFFFF; --cyan:#6BD8FF; --red:#FF6B9A; --green:#4BE8A8;
  --blob1:rgba(255,60,170,.42); --blob2:rgba(0,170,255,.38); --blob3:rgba(110,60,255,.55); --optbg:#1C1940; color-scheme:dark; } }
:root[data-skin="cam"][data-theme="dark"]{
  --bg:#0C0A22; --panel:rgba(255,255,255,.07); --panel2:rgba(255,255,255,.11); --edge:rgba(255,255,255,.17); --field:rgba(255,255,255,.07); --track:rgba(255,255,255,.14); --line:rgba(255,255,255,.08);
  --ink:#F4F2FF; --dim:#BCB8E4; --faint:#7C78A8;
  --amber:#B3A6FF; --amberbg:#7C5CFF; --onamber:#FFFFFF; --cyan:#6BD8FF; --red:#FF6B9A; --green:#4BE8A8;
  --blob1:rgba(255,60,170,.42); --blob2:rgba(0,170,255,.38); --blob3:rgba(110,60,255,.55); --optbg:#1C1940; color-scheme:dark; }
[data-skin="cam"] body{background:radial-gradient(42% 32% at 12% 8%,var(--blob1),transparent 70%),radial-gradient(48% 38% at 95% 28%,var(--blob2),transparent 70%),radial-gradient(60% 45% at 40% 100%,var(--blob3),transparent 70%),var(--bg);background-attachment:fixed}
[data-skin="cam"] .cut{clip-path:none;border-radius:24px}
[data-skin="cam"] .hud,[data-skin="cam"] .pane,[data-skin="cam"] .tabs,[data-skin="cam"] .sheet,[data-skin="cam"] .tour-pop,[data-skin="cam"] #gameRes{background:var(--panel);border:1px solid var(--edge);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);box-shadow:0 10px 36px rgba(20,10,80,.14)}
[data-skin="cam"] select option{background:var(--optbg);color:var(--ink)}
[data-skin="cam"] select,[data-skin="cam"] input[type=search]{border-radius:16px;background-color:var(--field);border-color:var(--edge);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
[data-skin="cam"] .gsearch input{border-radius:999px}
[data-skin="cam"] #gameRes,[data-skin="cam"] #partRes{border-radius:18px;margin-top:4px;border-top:1px solid var(--edge)}
[data-skin="cam"] .seg{border-radius:999px;padding:3px;gap:2px;background:var(--field);border-color:var(--edge)}
[data-skin="cam"] .seg button{border-radius:999px}
[data-skin="cam"] .seg button+button{box-shadow:none}
[data-skin="cam"] .seg button.on{background:linear-gradient(135deg,var(--amberbg),var(--accent2,#C04CFF));color:var(--onamber);box-shadow:0 4px 14px color-mix(in srgb,var(--amberbg) 40%,transparent)}
[data-skin="cam"] .gear{border-radius:50%;background:var(--field);border-color:var(--edge)}
[data-skin="cam"] .logo{filter:drop-shadow(0 2px 6px color-mix(in srgb,var(--amberbg) 45%,transparent))}
[data-skin="cam"] .hud{grid-template-columns:auto 1fr;padding:14px 16px}
[data-skin="cam"] .gauge{display:none}
[data-skin="cam"] .meter2{display:block}
[data-skin="cam"] .mbig,[data-skin="cam"] .mbar{display:none}
[data-skin="cam"] .mring{display:grid;place-items:center;align-content:center;width:112px;height:112px;border-radius:50%;position:relative;background:conic-gradient(from 216deg,var(--c) calc(var(--p)*.8%),var(--track) 0 80%,transparent 0);-webkit-mask:radial-gradient(closest-side,transparent 74%,#000 75%);mask:radial-gradient(closest-side,transparent 74%,#000 75%)}
[data-skin="cam"] .mringwrap{position:relative;width:112px;height:112px}
[data-skin="cam"] .mringwrap .mtxt{position:absolute;inset:0;display:grid;place-items:center;align-content:center;line-height:1}
[data-skin="cam"] .mtxt b{font-family:var(--display);font-size:38px;font-weight:700}
[data-skin="cam"] .mtxt span{font-size:13px;color:var(--dim);margin-top:2px}
[data-skin="cam"] .mringwrap i{position:absolute;left:50%;top:50%;width:4px;height:16px;margin:-56px 0 0 -2px;transform-origin:2px 56px;transform:rotate(calc(-144deg + var(--t)*2.88deg));background:var(--amberbg);border-radius:2px;box-shadow:0 0 8px var(--amberbg)}
[data-skin="cam"] .vt .st{font-size:20px}
[data-skin="cam"] input[type=range]::-webkit-slider-thumb{clip-path:none;border-radius:50%;width:22px;height:22px;margin-top:-9px;background:#fff;border:0;box-shadow:0 2px 8px rgba(40,20,120,.35)}
[data-skin="cam"] .hz button{border-radius:999px;background:var(--field);border-color:var(--edge)}
[data-skin="cam"] .hz button.on{background:var(--amberbg);color:var(--onamber);border-color:transparent}
[data-skin="cam"] .tabs{border-radius:999px;padding:4px;gap:3px}
[data-skin="cam"] .tabs button{border-radius:999px}
[data-skin="cam"] .tabs button.on{background:linear-gradient(135deg,var(--amberbg),var(--accent2,#C04CFF));color:var(--onamber)}
[data-skin="cam"] .tabs button.on::after{display:none}
[data-skin="cam"] .pane{padding:14px}
[data-skin="cam"] .set{border-left:0;border-radius:16px;padding:10px 12px;margin-bottom:6px;background:var(--field);border-bottom:0}
[data-skin="cam"] .set.ch{background:linear-gradient(90deg,color-mix(in srgb,var(--amberbg) 22%,transparent),var(--field))}
[data-skin="cam"] .set.lock{background:linear-gradient(90deg,rgba(10,127,192,.20),var(--field))}
[data-skin="cam"] .pips{gap:5px}
[data-skin="cam"] .pips button{transform:none;border-radius:50%;width:11px;height:11px;border:1.5px solid var(--faint)}
[data-skin="cam"] .pips button.f{background:var(--amberbg);box-shadow:0 0 6px var(--amberbg)}
[data-skin="cam"] .cinesum,[data-skin="cam"] .info,[data-skin="cam"] .warn,[data-skin="cam"] .replay,[data-skin="cam"] .closeb,[data-skin="cam"] .tour-foot button,[data-skin="cam"] .skins button{border-radius:16px}

/* ---------- ARENA: esports broadcast layout ---------- */
[data-skin="arena"] body{background-image:radial-gradient(80% 45% at 50% -10%,var(--glow1),transparent 70%),repeating-linear-gradient(115deg,transparent 0 22px,var(--glow2) 22px 23px)}
[data-skin="arena"] .cut{clip-path:polygon(0 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%)}
[data-skin="arena"] .ph,[data-skin="arena"] .seg button,[data-skin="arena"] .tabs button,[data-skin="arena"] .tour-pop h3,[data-skin="arena"] .vt .st,[data-skin="arena"] .lab{text-transform:uppercase;letter-spacing:.06em}
[data-skin="arena"] .ph{font-style:italic;border-left:4px solid var(--amberbg);padding-left:8px}
[data-skin="arena"] .seg{border:0;gap:3px;background:transparent}
[data-skin="arena"] .seg button{transform:skewX(-14deg);background:var(--field);border:1px solid var(--edge);font-size:12.5px}
[data-skin="arena"] .seg button+button{box-shadow:none}
[data-skin="arena"] .seg button.on{background:var(--amberbg);border-color:var(--amberbg)}
[data-skin="arena"] .hud{grid-template-columns:auto 1fr;background:linear-gradient(100deg,var(--panel2) 0 38%,var(--panel) 38%);border-top:3px solid var(--amberbg);padding:12px 14px}
[data-skin="arena"] .gauge{display:none}
[data-skin="arena"] .meter2{display:block;padding-right:14px;border-right:2px solid var(--edge);min-width:118px}
[data-skin="arena"] .mbig{display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}
[data-skin="arena"] .mbig b{font-family:var(--display);font-size:58px;line-height:.85;font-weight:700;font-style:italic;letter-spacing:-.03em}
[data-skin="arena"] .mbig span{font-family:var(--display);font-weight:700;font-style:italic;font-size:15px;color:var(--dim)}
[data-skin="arena"] .mbig em{flex-basis:100%;font-style:normal;font-family:var(--display);font-size:12.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
[data-skin="arena"] .mbar{position:relative;height:12px;margin-top:8px;background:repeating-linear-gradient(90deg,var(--track) 0 7px,transparent 7px 10px);transform:skewX(-20deg)}
[data-skin="arena"] .mbar i{position:absolute;inset:0 auto 0 0;-webkit-mask:repeating-linear-gradient(90deg,#000 0 7px,transparent 7px 10px);mask:repeating-linear-gradient(90deg,#000 0 7px,transparent 7px 10px)}
[data-skin="arena"] .mbar u{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--ink)}
[data-skin="arena"] .tg output{font-style:italic;font-size:24px}
[data-skin="arena"] .hz button{transform:skewX(-14deg);font-style:italic}
[data-skin="arena"] .hz button.on{background:var(--amberbg);color:var(--onamber);border-color:var(--amberbg)}
[data-skin="arena"] .tabs{border:0;background:transparent;gap:5px;counter-reset:tb}
[data-skin="arena"] .tabs button{transform:skewX(-14deg);background:var(--field);border:1px solid var(--edge);font-style:italic;font-weight:700;white-space:nowrap;font-size:13px;letter-spacing:.02em;padding:9px 2px}
[data-skin="arena"] .tabs button::before{counter-increment:tb;content:"0" counter(tb) " ";color:var(--amber);font-size:12px}
[data-skin="arena"] .tabs button.on{background:var(--amberbg);color:var(--onamber);border-color:var(--amberbg)}
[data-skin="arena"] .tabs button.on::before{color:var(--onamber)}
[data-skin="arena"] .tabs button.on::after{display:none}
[data-skin="arena"] .pane{border:0;border-top:3px solid var(--amberbg);background:var(--panel)}
[data-skin="arena"] #pSet{counter-reset:st}
[data-skin="arena"] .set{grid-template-columns:30px 1fr auto;border-left:0;padding:9px 4px}
[data-skin="arena"] .set:nth-of-type(even){background:var(--panel2)}
[data-skin="arena"] .set::before{counter-increment:st;content:counter(st,decimal-leading-zero);grid-row:1/3;align-self:start;font-family:var(--display);font-weight:700;font-style:italic;font-size:15px;color:var(--faint);padding-top:1px}
[data-skin="arena"] .set.ch::before{color:var(--amber)}
[data-skin="arena"] .set.lock::before{color:var(--cyan)}
[data-skin="arena"] .set.ch,[data-skin="arena"] .set.lock{background:linear-gradient(90deg,color-mix(in srgb,var(--amberbg) 12%,transparent),transparent 60%)}
[data-skin="arena"] .set .gain{grid-column:2/-1}
[data-skin="arena"] .set .nm{text-transform:uppercase;font-size:13.5px;letter-spacing:.03em}
[data-skin="arena"] .set .lvl{font-style:italic;text-transform:uppercase;font-size:13px}
[data-skin="arena"] .set.ch .lvl{color:var(--amber)}
[data-skin="arena"] .pips{gap:2px}
[data-skin="arena"] .pips button{transform:skewX(-24deg);width:10px;height:16px}
[data-skin="arena"] input[type=range]::-webkit-slider-thumb{clip-path:polygon(0 0,100% 0,100% 70%,50% 100%,0 70%)}
[data-skin="arena"] .cinesum{border:0;border-left:4px solid var(--amberbg)}

.skins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

  const amd = /Ryzen/.test(cpuName), x3d = /X3D/.test(cpuName);

  mfgOverride:['Oyunda normal DLSS kare üretimi var; 3x ve üstü NVIDIA uygulamasındaki "DLSS Override - Kare Üretimi Modu" ile açılır.','The game has standard DLSS frame gen; 3x and above are enabled via "DLSS Override - Frame Generation Mode" in the NVIDIA app.','Le jeu a la génération d\'images DLSS standard ; 3x et plus via « DLSS Override - Frame Generation Mode » dans l\'app NVIDIA.','El juego tiene generación DLSS estándar; 3x o más se activa con «DLSS Override - Frame Generation Mode» en la app de NVIDIA.','Il gioco ha la frame generation DLSS standard; 3x e oltre si attivano con «DLSS Override - Frame Generation Mode» nell\'app NVIDIA.','Das Spiel hat normale DLSS-Frame-Generierung; ab 3x über „DLSS Override - Frame Generation Mode“ in der NVIDIA-App.','В игре обычная генерация DLSS; 3x и выше включаются через «DLSS Override - Frame Generation Mode» в приложении NVIDIA.','游戏自带标准 DLSS 帧生成；3x 及以上需在 NVIDIA App 的“DLSS Override - Frame Generation Mode”中开启。','O jogo tem geração DLSS padrão; 3x ou mais via “DLSS Override - Frame Generation Mode” no app da NVIDIA.'],
  six:[' 5x ve 6x bu oyunda resmi olarak listelenmiyor; NVIDIA uygulaması oyunun kare üretimi dosyasını güncellediğinde çalışır.',' 5x and 6x aren\'t officially listed for this game; they work when the NVIDIA app updates the game\'s frame gen file.',' 5x et 6x ne sont pas officiellement listés ; ils fonctionnent quand l\'app NVIDIA met à jour le fichier du jeu.',' 5x y 6x no figuran oficialmente; funcionan cuando la app de NVIDIA actualiza el archivo del juego.',' 5x e 6x non sono ufficialmente elencati; funzionano quando l\'app NVIDIA aggiorna il file del gioco.',' 5x und 6x sind offiziell nicht gelistet; sie funktionieren, wenn die NVIDIA-App die Datei des Spiels aktualisiert.',' 5x и 6x официально не заявлены; работают, когда приложение NVIDIA обновляет файл игры.',' 该游戏未正式列出 5x 和 6x；当 NVIDIA App 更新游戏的帧生成文件后可用。',' 5x e 6x não constam oficialmente; funcionam quando o app da NVIDIA atualiza o arquivo do jogo.'],
  latency:['Akıcılık artar ama gecikme de artar; gerçek FPS 50-60 altındaysa hissedilir.','Smoothness goes up, but so does latency; it\'s noticeable below 50-60 real FPS.','Plus fluide, mais plus de latence ; perceptible sous 50-60 FPS réels.','Más fluidez pero más latencia; se nota por debajo de 50-60 FPS reales.','Più fluidità ma più latenza; si nota sotto 50-60 FPS reali.','Flüssiger, aber mehr Latenz; spürbar unter 50-60 echten FPS.','Плавнее, но выше задержка; заметно ниже 50-60 реальных FPS.','画面更流畅但延迟增加；真实帧率低于 50-60 时会明显。','Mais fluidez, mas mais latência; perceptível abaixo de 50-60 FPS reais.'],

  dynText:['Çarpan sahneye göre 2x ile {max}x arasında otomatik değişir ve {t} FPS hedefine kilitlenir. Bu ayarlarda ortalama ~{m}x. ','The multiplier shifts between 2x and {max}x per scene and locks to {t} FPS. Average here ~{m}x. ','Le multiplicateur varie entre 2x et {max}x selon la scène et se cale sur {t} FPS. Moyenne ici ~{m}x. ','El multiplicador cambia entre 2x y {max}x según la escena y se fija en {t} FPS. Media aquí ~{m}x. ','Il moltiplicatore varia tra 2x e {max}x e si blocca a {t} FPS. Media qui ~{m}x. ','Der Faktor wechselt je nach Szene zwischen 2x und {max}x und hält {t} FPS. Hier im Schnitt ~{m}x. ','Множитель меняется от 2x до {max}x и держит {t} FPS. В среднем здесь ~{m}x. ','倍数会按场景在 2x 到 {max}x 间自动切换，并锁定 {t} FPS。此设置下平均约 {m}x。','O multiplicador varia entre 2x e {max}x conforme a cena e trava em {t} FPS. Média aqui ~{m}x. '],
  dynNative:['Oyunun menüsünde doğrudan var.','Available directly in the game\'s menu.','Disponible directement dans le menu du jeu.','Disponible directamente en el menú del juego.','Disponibile direttamente nel menu del gioco.','Direkt im Spielmenü verfügbar.','Есть прямо в меню игры.','游戏菜单中可直接开启。','Disponível direto no menu do jogo.'],
  dynApp:['NVIDIA uygulamasında Grafik > DLSS Override - Kare Üretimi Modu > Dinamik ile açılır, hedef olarak "Maks. yenileme hızı" seç.','Enable it in the NVIDIA app: Graphics > DLSS Override - Frame Generation Mode > Dynamic, then choose "Max refresh rate".','Activez-le dans l\'app NVIDIA : Graphismes > DLSS Override - Frame Generation Mode > Dynamique, puis « Taux de rafraîchissement max ».','Actívalo en la app de NVIDIA: Gráficos > DLSS Override - Frame Generation Mode > Dinámico y elige «Frecuencia máxima».','Attivalo nell\'app NVIDIA: Grafica > DLSS Override - Frame Generation Mode > Dinamico e scegli «Frequenza massima».','In der NVIDIA-App: Grafik > DLSS Override - Frame Generation Mode > Dynamisch, dann „Maximale Bildwiederholrate“.','В приложении NVIDIA: Графика > DLSS Override - Frame Generation Mode > Динамический, цель — «Макс. частота обновления».','在 NVIDIA App 中：图形 > DLSS Override - Frame Generation Mode > 动态，并选择“最大刷新率”。','No app da NVIDIA: Gráficos > DLSS Override - Frame Generation Mode > Dinâmico e escolha “Taxa de atualização máxima”.'],

  drvLegacy:['Bu kart artık yeni oyun optimizasyonu almıyor, sadece güvenlik güncellemeleri geliyor. 2025 ve sonrası oyunlarda tahminler buna göre ~%7 düşürüldü.','This card no longer gets new game optimizations, only security updates. Estimates for 2025+ games are lowered by ~7% accordingly.','Cette carte ne reçoit plus d\'optimisations pour les nouveaux jeux, seulement des correctifs de sécurité. Estimations réduites d\'environ 7 % pour les jeux 2025+.','Esta tarjeta ya no recibe optimizaciones para juegos nuevos, solo parches de seguridad. Estimaciones reducidas ~7% en juegos de 2025+.','Questa scheda non riceve più ottimizzazioni per i nuovi giochi, solo aggiornamenti di sicurezza. Stime ridotte di ~7% per i giochi 2025+.','Diese Karte erhält keine Spieleoptimierungen mehr, nur Sicherheitsupdates. Schätzungen für Spiele ab 2025 um ~7 % gesenkt.','Карта больше не получает оптимизаций для новых игр, только обновления безопасности. Для игр 2025+ оценки снижены на ~7%.','此显卡已不再获得新游戏优化，只有安全更新。2025 年及以后游戏的估算已下调约 7%。','Esta placa não recebe mais otimizações para jogos novos, só atualizações de segurança. Estimativas de jogos 2025+ reduzidas em ~7%.'],

  compInfo:['Rekabetçi profil: görüşü bozan efektler kapatılır, rakipleri görmeyi kolaylaştıran ayarlar korunur, gecikmeyi artıran kare üretimi kullanılmaz.','Competitive profile: effects that hurt visibility are turned off, settings that help you spot enemies are kept, and latency-adding frame generation is not used.','Profil compétitif : les effets qui gênent la visibilité sont coupés, ceux qui aident à repérer l\'ennemi sont conservés, et la génération d\'images est exclue.','Perfil competitivo: se desactivan los efectos que dificultan la visibilidad, se mantienen los que ayudan a ver rivales y no se usa generación de fotogramas.','Profilo competitivo: gli effetti che ostacolano la visibilità vengono spenti, quelli che aiutano a vedere i nemici restano, niente frame generation.','Kompetitives Profil: Effekte, die die Sicht stören, werden abgeschaltet, Einstellungen zum Erkennen von Gegnern bleiben, keine latenzerhöhende Frame-Generierung.','Соревновательный профиль: мешающие обзору эффекты отключаются, полезные для обнаружения соперников остаются, генерация кадров не используется.','竞技方案：关闭影响视野的特效，保留有助于发现对手的设置，不使用会增加延迟的帧生成。','Perfil competitivo: efeitos que atrapalham a visibilidade são desligados, ajustes que ajudam a ver rivais são mantidos e não se usa geração de quadros.'],

  tipIntel:['Intel XeLL düşük gecikme: Açık (oyun destekliyorsa)','Intel XeLL low latency: On (if supported)','Intel XeLL faible latence : Activé (si pris en charge)','Intel XeLL baja latencia: Activado (si se admite)','Intel XeLL bassa latenza: Attivo (se supportato)','Intel XeLL niedrige Latenz: An (falls unterstützt)','Intel XeLL низкая задержка: Вкл. (если поддерживается)','Intel XeLL 低延迟：开启（如支持）','Intel XeLL baixa latência: Ligado (se suportado)'],
  tipVsync:['V-Sync: Kapalı · Görüntü modu: Tam ekran','V-Sync: Off · Display mode: Fullscreen','V-Sync : désactivé · Mode : plein écran','V-Sync: desactivado · Modo: pantalla completa','V-Sync: disattivato · Modalità: schermo intero','V-Sync: Aus · Anzeigemodus: Vollbild','V-Sync: выкл. · Режим: полноэкранный','垂直同步：关 · 显示模式：全屏','V-Sync: desligado · Modo: tela cheia'],
  tipCap:['G-Sync/FreeSync açıksa FPS sınırını {x} yap; kapalıysa sınırsız bırak ya da sabit tutabildiğin en yüksek değere sabitle.','With G-Sync/FreeSync on, cap FPS at {x}; otherwise leave it uncapped or cap at the highest value you can hold steadily.','Avec G-Sync/FreeSync, limitez à {x} FPS ; sinon pas de limite, ou la valeur la plus haute que vous tenez de façon stable.','Con G-Sync/FreeSync, limita a {x} FPS; si no, sin límite o el valor más alto que mantengas estable.','Con G-Sync/FreeSync limita a {x} FPS; altrimenti nessun limite o il valore più alto che tieni stabile.','Mit G-Sync/FreeSync auf {x} FPS begrenzen; sonst unbegrenzt oder auf den höchsten stabil gehaltenen Wert.','С G-Sync/FreeSync ограничьте FPS до {x}; без них — без лимита или на максимуме, который держится стабильно.','开启 G-Sync/FreeSync 时将帧率上限设为 {x}；否则不限制，或设为能稳定保持的最高值。','Com G-Sync/FreeSync, limite a {x} FPS; sem isso, sem limite ou no maior valor que você mantém estável.'],
  tipCpuHigh:['Bu FPS seviyesinde işlemci belirleyici: arka plandaki tarayıcı, kayıt ve RGB programlarını kapat.','At this frame rate the CPU decides: close background browsers, recorders and RGB apps.','À ce niveau, c\'est le processeur qui compte : fermez navigateurs, enregistreurs et logiciels RGB.','A estos FPS manda la CPU: cierra navegadores, grabadores y programas RGB.','A questi FPS conta la CPU: chiudi browser, registratori e software RGB.','Bei dieser Bildrate entscheidet die CPU: Browser, Aufnahme- und RGB-Tools schließen.','На таком FPS решает процессор: закройте браузер, запись и RGB-программы.','在此帧率下处理器起决定作用：关闭后台浏览器、录制和 RGB 软件。','Nesse FPS quem manda é o processador: feche navegadores, gravadores e apps de RGB.'],
  fgCompOff:['Rekabetçi profilde kare üretimi gecikmeyi artırdığı için kullanılmıyor.','Frame generation isn\'t used in the competitive profile because it adds latency.','La génération d\'images n\'est pas utilisée en profil compétitif car elle ajoute de la latence.','En el perfil competitivo no se usa generación de fotogramas porque añade latencia.','Nel profilo competitivo la frame generation non si usa perché aggiunge latenza.','Im kompetitiven Profil keine Frame-Generierung, da sie Latenz erhöht.','В соревновательном профиле генерация кадров не используется: она добавляет задержку.','竞技方案不使用帧生成，因为会增加延迟。','No perfil competitivo a geração de quadros não é usada porque aumenta a latência.'],

  hhInfo:['Ekran: {r} · Paylaşımlı bellek: {m} GB · Güç: {w}','Screen: {r} · Shared memory: {m} GB · Power: {w}','Écran : {r} · Mémoire partagée : {m} Go · Puissance : {w}','Pantalla: {r} · Memoria compartida: {m} GB · Potencia: {w}','Schermo: {r} · Memoria condivisa: {m} GB · Potenza: {w}','Bildschirm: {r} · Geteilter Speicher: {m} GB · Leistung: {w}','Экран: {r} · Общая память: {m} ГБ · Мощность: {w}','屏幕：{r} · 共享显存：{m} GB · 功耗：{w}','Tela: {r} · Memória compartilhada: {m} GB · Potência: {w}'],
  lapNote:['Dizüstü ekran kartlarında performans, üreticinin verdiği güç limitine (TGP) göre ±%20 değişebilir. Laptopunun TGP değerini üreticinin sitesinden öğrenip doğru güç modunu seç.','Laptop GPU performance can vary ±20% depending on the power limit (TGP) set by the manufacturer. Check your laptop\'s TGP on the maker\'s site and pick the matching power mode.','Les performances des GPU portables varient de ±20 % selon la limite de puissance (TGP). Vérifiez le TGP de votre portable et choisissez le mode correspondant.','El rendimiento de las GPU portátiles varía ±20% según el límite de potencia (TGP). Consulta el TGP de tu portátil y elige el modo adecuado.','Le prestazioni delle GPU portatili variano di ±20% in base al limite di potenza (TGP). Controlla il TGP del tuo portatile e scegli la modalità giusta.','Die Leistung von Laptop-GPUs schwankt je nach Leistungslimit (TGP) um ±20 %. Prüfe die TGP deines Laptops und wähle den passenden Modus.','Производительность мобильных видеокарт меняется на ±20% в зависимости от лимита мощности (TGP). Узнайте TGP своего ноутбука и выберите режим.','笔记本显卡性能会因厂商设定的功耗上限 (TGP) 而有 ±20% 差异。请在厂商官网查看 TGP 并选择对应模式。','O desempenho de GPUs de notebook varia ±20% conforme o limite de energia (TGP). Veja o TGP do seu notebook e escolha o modo certo.'],
  hhNote:['El konsollarında ekranın kendi çözünürlüğü ya da 720p/800p en iyi dengeyi verir. Pil tasarrufu modunda oyun süresi uzar ama FPS belirgin düşer.','On handhelds, the native screen resolution or 720p/800p gives the best balance. Battery saver extends playtime but lowers FPS noticeably.','Sur console portable, la résolution native ou 720p/800p offre le meilleur équilibre. Le mode économie prolonge l\'autonomie mais baisse nettement les FPS.','En portátiles, la resolución nativa o 720p/800p da el mejor equilibrio. El modo ahorro alarga la batería pero baja bastante los FPS.','Sulle portatili, la risoluzione nativa o 720p/800p offre il miglior equilibrio. Il risparmio allunga l\'autonomia ma riduce molto gli FPS.','Auf Handhelds bieten native Auflösung oder 720p/800p die beste Balance. Akku sparen verlängert die Laufzeit, senkt aber die FPS deutlich.','На портативках лучший баланс дают родное разрешение или 720p/800p. Экономия продлевает работу, но заметно снижает FPS.','掌机上使用屏幕原生分辨率或 720p/800p 最均衡。省电模式续航更长，但帧率明显下降。','Em portáteis, a resolução nativa ou 720p/800p dá o melhor equilíbrio. O modo economia aumenta a bateria, mas reduz bem o FPS.'],
  steamos:['SteamOS ekran sürücüleri sistem güncellemeleriyle otomatik gelir.','SteamOS graphics drivers update automatically with system updates.','Les pilotes graphiques de SteamOS se mettent à jour avec le système.','Los controladores de SteamOS se actualizan con el sistema.','I driver di SteamOS si aggiornano con il sistema.','SteamOS-Grafiktreiber kommen automatisch mit Systemupdates.','Драйверы SteamOS обновляются вместе с системой.','SteamOS 显卡驱动随系统更新自动升级。','Os drivers do SteamOS atualizam junto com o sistema.'],

  t1h:['FPSmith\'e hoş geldin','Welcome to FPSmith','Bienvenue dans FPSmith','Bienvenido a FPSmith','Benvenuto in FPSmith','Willkommen bei FPSmith','Добро пожаловать в FPSmith','欢迎使用 FPSmith','Bem-vindo ao FPSmith'],
  t1:['Bir oyun ve FPS hedefi seç; uygulama sistemine göre o hedefi tutturan en güzel ayarları bulsun. Kısa bir turla nasıl kullanıldığını göstereyim.','Pick a game and an FPS target, and the app finds the best-looking settings that hit it on your system. Here\'s a quick tour.','Choisissez un jeu et un objectif de FPS : l\'app trouve les plus beaux réglages qui l\'atteignent sur votre PC. Petite visite guidée.','Elige un juego y un objetivo de FPS: la app encuentra los ajustes más bonitos que lo alcanzan en tu equipo. Te lo enseño en un momento.','Scegli un gioco e un obiettivo di FPS: l\'app trova le impostazioni più belle che lo raggiungono sul tuo sistema. Ecco un breve tour.','Wähle ein Spiel und ein FPS-Ziel – die App findet die schönsten Einstellungen, die es auf deinem System erreichen. Kurze Tour gefällig?','Выберите игру и цель по FPS — приложение подберёт самые красивые настройки, которые её достигают. Короткое знакомство.','选择游戏和帧率目标，应用会为你的系统找到达到目标且画面最好的设置。下面快速介绍一下。','Escolha um jogo e uma meta de FPS: o app encontra as configurações mais bonitas que a atingem no seu sistema. Veja um tour rápido.'],
  t2h:['Oyununu seç','Choose your game','Choisissez votre jeu','Elige tu juego','Scegli il gioco','Wähle dein Spiel','Выберите игру','选择游戏','Escolha seu jogo'],
  t2:['★ işaretli oyunlarda ayarlar oyunun menüsüyle birebir aynı. Çözünürlüğü yanından, uygulama ayarlarını dişli simgesinden değiştirebilirsin.','Games marked ★ show settings exactly as in the game\'s menu. Pick the resolution next to it; the gear opens app settings.','Les jeux marqués ★ reprennent exactement le menu du jeu. Choisissez la résolution à côté ; l\'engrenage ouvre les paramètres.','Los juegos con ★ muestran los ajustes tal cual en el menú del juego. Elige la resolución al lado; el engranaje abre los ajustes.','I giochi con ★ mostrano le impostazioni esattamente come nel menu. Scegli la risoluzione accanto; l\'ingranaggio apre le impostazioni.','Bei ★-Spielen entsprechen die Einstellungen exakt dem Spielmenü. Daneben wählst du die Auflösung, das Zahnrad öffnet die App-Einstellungen.','В играх со ★ настройки как в меню игры. Рядом выбирается разрешение, шестерёнка открывает настройки приложения.','带 ★ 的游戏与游戏内菜单完全一致。旁边可选分辨率，齿轮图标打开应用设置。','Jogos com ★ mostram as opções exatamente como no menu do jogo. Ao lado escolha a resolução; a engrenagem abre as configurações.'],
  t3h:['Hedefini belirle','Set your target','Fixez votre objectif','Fija tu objetivo','Imposta l\'obiettivo','Leg dein Ziel fest','Задайте цель','设定目标','Defina sua meta'],
  t3:['Kaydırıcıyla 30 ile 720 FPS arasında bir hedef seç ya da monitörünün Hz değerine dokun.','Drag the slider to pick a target from 30 to 720 FPS, or tap your monitor\'s refresh rate.','Faites glisser pour choisir entre 30 et 720 FPS, ou touchez la fréquence de votre écran.','Desliza para elegir entre 30 y 720 FPS, o toca la frecuencia de tu monitor.','Trascina per scegliere tra 30 e 720 FPS, oppure tocca la frequenza del monitor.','Ziehe den Regler auf 30 bis 720 FPS oder tippe auf die Hz-Zahl deines Monitors.','Сдвиньте ползунок от 30 до 720 FPS или нажмите частоту своего монитора.','拖动滑块在 30 到 720 FPS 之间选择，或点按显示器刷新率。','Arraste para escolher de 30 a 720 FPS ou toque na taxa do seu monitor.'],
  t4h:['Sonucu gör','See the result','Voyez le résultat','Mira el resultado','Guarda il risultato','Sieh dir das Ergebnis an','Смотрите результат','查看结果','Veja o resultado'],
  t4:['Kadran tahmini FPS\'i, amber çizgi hedefini gösterir. Yeşilse hedef tutuyor; altında en çok kazandıran değişiklik yazar.','The gauge shows estimated FPS and the amber mark your target. Green means you hit it; the biggest gain is listed below.','La jauge indique les FPS estimés, le trait ambre votre objectif. Vert : objectif atteint ; le plus gros gain est indiqué dessous.','El indicador muestra los FPS estimados y la marca ámbar tu objetivo. Verde significa que lo alcanzas; debajo verás la mayor ganancia.','L\'indicatore mostra gli FPS stimati, il segno ambra l\'obiettivo. Verde: raggiunto; sotto c\'è il guadagno maggiore.','Die Anzeige zeigt die geschätzten FPS, die gelbe Markierung dein Ziel. Grün heißt erreicht; darunter steht der größte Gewinn.','Шкала показывает ожидаемый FPS, янтарная метка — цель. Зелёный — цель достигнута; ниже указано, что даёт больше всего.','仪表显示预估帧率，琥珀色刻度是目标。绿色表示达成，下方显示提升最大的改动。','O medidor mostra o FPS estimado e a marca âmbar a sua meta. Verde: meta atingida; abaixo aparece o maior ganho.'],
  t5h:['Sistemini gir','Enter your system','Indiquez votre configuration','Indica tu sistema','Inserisci il sistema','Gib dein System an','Укажите систему','输入你的配置','Informe seu sistema'],
  t5:['Masaüstü, dizüstü ya da el konsolu seç; ekran kartını, işlemcini ve RAM\'ini belirt. Sürücü bilgisi ve uyarılar da bu bölümde.','Choose desktop, laptop or handheld, then set your GPU, CPU and RAM. Driver info and warnings live here too.','Choisissez fixe, portable ou console portable, puis la carte graphique, le processeur et la RAM. Pilote et alertes sont ici aussi.','Elige sobremesa, portátil o consola portátil e indica GPU, CPU y RAM. Aquí también están el controlador y los avisos.','Scegli desktop, portatile o console portatile e indica GPU, CPU e RAM. Qui trovi anche driver e avvisi.','Wähle Desktop, Laptop oder Handheld und gib GPU, CPU und RAM an. Treiberinfos und Hinweise findest du ebenfalls hier.','Выберите ПК, ноутбук или портативку и укажите видеокарту, процессор и ОЗУ. Здесь же драйвер и предупреждения.','选择台式机、笔记本或掌机，并设置显卡、处理器和内存。驱动信息和提示也在这里。','Escolha desktop, notebook ou portátil e informe GPU, CPU e RAM. Driver e avisos também ficam aqui.'],
  t6h:['Önerilen ayarlar','Recommended settings','Réglages recommandés','Ajustes recomendados','Impostazioni consigliate','Empfohlene Einstellungen','Рекомендуемые настройки','推荐设置','Configurações recomendadas'],
  t6:['Değişen ayarlar renkli görünür. Bir kademeye dokunarak o ayarı kilitle, gerisini uygulama ayarlasın. Kopyala ile listeyi paylaşabilirsin.','Changed settings are highlighted. Tap a step to lock that setting and the app adjusts the rest. Copy shares the list.','Les réglages modifiés sont en couleur. Touchez un cran pour le verrouiller, l\'app ajuste le reste. Copier partage la liste.','Los ajustes cambiados aparecen en color. Toca un nivel para bloquearlo y la app ajusta el resto. Copiar comparte la lista.','Le impostazioni cambiate sono evidenziate. Tocca un livello per bloccarlo, l\'app regola il resto. Copia condivide l\'elenco.','Geänderte Einstellungen sind farbig. Tippe auf eine Stufe, um sie zu sperren – die App passt den Rest an. Kopieren teilt die Liste.','Изменённые настройки подсвечены. Нажмите на уровень, чтобы закрепить его, остальное приложение подстроит. «Копировать» делится списком.','改动过的设置会高亮显示。点按档位即可锁定该设置，其余由应用调整。“复制”可分享列表。','Opções alteradas ficam destacadas. Toque num nível para travá-lo e o app ajusta o resto. Copiar compartilha a lista.'],
  t7h:['DLSS, FSR ve kare üretimi','DLSS, FSR and frame generation','DLSS, FSR et génération d\'images','DLSS, FSR y generación de fotogramas','DLSS, FSR e frame generation','DLSS, FSR und Frame-Generierung','DLSS, FSR и генерация кадров','DLSS、FSR 与帧生成','DLSS, FSR e geração de quadros'],
  t7:['Ölçekleme sürümünü ve modunu seç, kare üretimini aç. Otomatik bırakırsan en uygununu uygulama seçer.','Choose the upscaler version and mode, and turn on frame generation. Leave it on Auto and the app picks the best fit.','Choisissez la version et le mode d\'upscaling, activez la génération d\'images. En Auto, l\'app choisit pour vous.','Elige versión y modo de escalado y activa la generación de fotogramas. En Automático, la app elige lo mejor.','Scegli versione e modalità di upscaling e attiva la frame generation. In Automatico sceglie l\'app.','Wähle Upscaler-Version und Modus und aktiviere Frame-Generierung. Auf Automatisch wählt die App das Passende.','Выберите версию и режим апскейлера, включите генерацию кадров. В режиме «Авто» приложение выберет само.','选择超分辨率版本和模式，并开启帧生成。设为自动则由应用挑选最合适的。','Escolha versão e modo de upscaling e ative a geração de quadros. No Automático, o app escolhe o melhor.'],
  t8h:['Dil ve tema','Language and theme','Langue et thème','Idioma y tema','Lingua e tema','Sprache und Design','Язык и тема','语言与主题','Idioma e tema'],
  t8:['Buradan dili değiştirebilir, aydınlık ya da karanlık temayı seçebilirsin. Bu rehberi de buradan tekrar açabilirsin.','Change the language and choose a light or dark theme here. You can replay this tour from here too.','Changez la langue et choisissez un thème clair ou sombre ici. Vous pouvez aussi relancer cette visite.','Aquí cambias el idioma y eliges tema claro u oscuro. También puedes repetir esta guía.','Qui cambi lingua e scegli tema chiaro o scuro. Puoi anche rivedere questa guida.','Hier änderst du Sprache und Design. Diese Tour kannst du hier auch erneut starten.','Здесь можно сменить язык и выбрать светлую или тёмную тему, а также снова открыть это обучение.','在这里更改语言、选择浅色或深色主题，也可以重新查看本引导。','Aqui você muda o idioma e escolhe tema claro ou escuro. Também dá para rever este tour.'],

  updCard:['Yeni bir sürüm indirildi. Yenilediğinde hemen kullanmaya başlarsın.','A new version has been downloaded. Refresh to start using it.','Une nouvelle version a été téléchargée. Actualisez pour l\'utiliser.','Se ha descargado una nueva versión. Actualiza para usarla.','È stata scaricata una nuova versione. Aggiorna per usarla.','Eine neue Version wurde geladen. Neu laden, um sie zu nutzen.','Загружена новая версия. Обновите, чтобы начать ею пользоваться.','新版本已下载，刷新后即可使用。','Uma nova versão foi baixada. Atualize para começar a usar.'],
  rtX3D:['{c} büyük önbelleği sayesinde bellek hızına az duyarlı: DDR5-4800 ile 8000 arasındaki fark oyunlarda ortalama %2 civarı.','{c} has a big cache, so memory speed matters little: DDR5-4800 vs 8000 is about 2% in games.','Grâce à son grand cache, le {c} est peu sensible à la mémoire : environ 2 % d\'écart entre DDR5-4800 et 8000 en jeu.','Gracias a su gran caché, el {c} es poco sensible a la memoria: unos 2 % de diferencia entre DDR5-4800 y 8000 en juegos.','Grazie alla grande cache, il {c} è poco sensibile alla memoria: circa 2% tra DDR5-4800 e 8000 nei giochi.','Dank großem Cache ist der {c} kaum speicherabhängig: DDR5-4800 vs. 8000 ≈ 2 % in Spielen.','Благодаря большому кэшу {c} мало зависит от памяти: DDR5-4800 и 8000 различаются в играх примерно на 2%.','{c} 拥有大缓存，对内存速度不敏感：游戏中 DDR5-4800 与 8000 仅相差约 2%。','Graças ao grande cache, o {c} depende pouco da memória: cerca de 2% entre DDR5-4800 e 8000 em jogos.'],
  rtAM5:['Bu işlemci için en verimli bellek DDR5-6000 CL30. 6400\'ün üstü oyunlarda neredeyse fark yaratmaz.','The sweet spot for this CPU is DDR5-6000 CL30. Above 6400 there is almost no gain in games.','Le meilleur choix pour ce processeur est la DDR5-6000 CL30. Au-delà de 6400, presque aucun gain en jeu.','Lo ideal para este procesador es DDR5-6000 CL30. Por encima de 6400 apenas hay ganancia en juegos.','Il punto ideale per questa CPU è DDR5-6000 CL30. Oltre 6400 quasi nessun guadagno nei giochi.','Der Sweet Spot für diese CPU ist DDR5-6000 CL30. Über 6400 bringt in Spielen kaum etwas.','Оптимальная память для этого процессора — DDR5-6000 CL30. Выше 6400 прироста в играх почти нет.','该处理器的最佳内存是 DDR5-6000 CL30，超过 6400 在游戏中几乎没有提升。','O ponto ideal para este processador é DDR5-6000 CL30. Acima de 6400 quase não há ganho em jogos.'],
  rtIntel:['Intel işlemciler hızlı belleğe daha duyarlı: DDR5-6000\'den 8000\'e çıkmak oyunlarda yaklaşık %4-5 kazandırabilir.','Intel CPUs respond more to fast memory: going from DDR5-6000 to 8000 can add about 4-5% in games.','Les processeurs Intel profitent davantage de la mémoire rapide : de DDR5-6000 à 8000, environ 4-5 % en jeu.','Los procesadores Intel aprovechan más la memoria rápida: de DDR5-6000 a 8000, alrededor de 4-5 % en juegos.','Le CPU Intel beneficiano di più della memoria veloce: da DDR5-6000 a 8000 circa 4-5% nei giochi.','Intel-CPUs profitieren stärker von schnellem Speicher: DDR5-6000 → 8000 bringt etwa 4–5 % in Spielen.','Процессоры Intel сильнее реагируют на быструю память: с DDR5-6000 до 8000 — около 4–5% в играх.','英特尔处理器对高速内存更敏感：从 DDR5-6000 提升到 8000，游戏中约可提升 4-5%。','Processadores Intel respondem mais à memória rápida: de DDR5-6000 para 8000, cerca de 4-5% em jogos.'],
  rtDDR4:['Bu platform DDR4 kullanır. En verimli seçim DDR4-3600 CL16 ya da DDR4-3200 CL14; 2666\'dan 3200\'e çıkmak bile yaklaşık %8 kazandırır.','This platform uses DDR4. Best value is DDR4-3600 CL16 or 3200 CL14; even 2666 → 3200 adds about 8%.','Cette plateforme utilise la DDR4. Idéal : DDR4-3600 CL16 ou 3200 CL14 ; passer de 2666 à 3200 apporte déjà ~8 %.','Esta plataforma usa DDR4. Lo ideal es DDR4-3600 CL16 o 3200 CL14; pasar de 2666 a 3200 ya aporta ~8 %.','Questa piattaforma usa DDR4. Ideale DDR4-3600 CL16 o 3200 CL14; da 2666 a 3200 si guadagna già ~8%.','Diese Plattform nutzt DDR4. Ideal: DDR4-3600 CL16 oder 3200 CL14; schon 2666 → 3200 bringt ~8 %.','Эта платформа использует DDR4. Оптимально DDR4-3600 CL16 или 3200 CL14; даже 2666 → 3200 даёт около 8%.','该平台使用 DDR4。最佳选择为 DDR4-3600 CL16 或 3200 CL14；从 2666 升到 3200 也能提升约 8%。','Esta plataforma usa DDR4. O ideal é DDR4-3600 CL16 ou 3200 CL14; de 2666 para 3200 já rende ~8%.'],
  rtIGPU:['Dahili grafik, sistem belleğini ekran belleği olarak kullanır; bu yüzden bellek hızı FPS\'i doğrudan etkiler.','Integrated graphics use system RAM as video memory, so memory speed directly affects FPS.','La puce graphique intégrée utilise la RAM système : la vitesse mémoire influe directement sur les FPS.','La gráfica integrada usa la RAM del sistema, así que la velocidad de memoria afecta directamente a los FPS.','La grafica integrata usa la RAM di sistema: la velocità della memoria incide direttamente sugli FPS.','Die integrierte Grafik nutzt den Arbeitsspeicher, daher wirkt sich der Speichertakt direkt auf die FPS aus.','Встроенная графика использует системную память, поэтому её скорость напрямую влияет на FPS.','集成显卡使用系统内存作为显存，因此内存速度会直接影响帧率。','O gráfico integrado usa a RAM do sistema, então a velocidade da memória afeta diretamente o FPS.'],
  rtLap:['Dizüstülerde bellek çoğunlukla değiştirilemez; doğru değeri bilgisayarının teknik özelliklerinden kontrol et.','Laptop memory is often soldered; check your laptop\'s specifications for the exact type.','La mémoire des portables est souvent soudée ; vérifiez le type exact dans les caractéristiques.','La memoria de los portátiles suele estar soldada; consulta el tipo exacto en las especificaciones.','La memoria dei portatili è spesso saldata; controlla il tipo esatto nelle specifiche.','Laptop-Speicher ist oft verlötet; den genauen Typ findest du im Datenblatt.','В ноутбуках память часто распаяна; точный тип смотрите в характеристиках.','笔记本内存通常为板载，具体类型请查看电脑规格。','A memória de notebooks costuma ser soldada; confira o tipo exato nas especificações.'],
  rt16:['16 GB çoğu oyunda yeterli, ama 2025 sonrası ağır oyunlarda ani takılmalar görülebilir. Yeni bir sistem için 32 GB önerilir.','16 GB is enough for most games, but heavy 2025+ games can stutter. 32 GB is recommended for new builds.','16 Go suffisent pour la plupart des jeux, mais les jeux lourds récents peuvent saccader. 32 Go recommandés pour une nouvelle config.','16 GB bastan para la mayoría, pero los juegos pesados recientes pueden dar tirones. Se recomiendan 32 GB en equipos nuevos.','16 GB bastano per la maggior parte dei giochi, ma i titoli pesanti recenti possono scattare. Consigliati 32 GB per nuove build.','16 GB reichen für die meisten Spiele, neue schwere Titel können aber ruckeln. Für neue Systeme 32 GB empfohlen.','16 ГБ хватает для большинства игр, но тяжёлые новинки могут подтормаживать. Для новой сборки лучше 32 ГБ.','16GB 足够应付大多数游戏，但 2025 年后的大作可能出现卡顿，新装机推荐 32GB。','16 GB bastam para a maioria dos jogos, mas jogos pesados recentes podem engasgar. Para PCs novos, 32 GB.'],
  rtBig:['{n} GB oyunlarda ek FPS sağlamaz; oyun için 32 GB yeterli. Fazlası video düzenleme, yayın ve modlu oyunlarda işe yarar.','{n} GB gives no extra FPS in games; 32 GB is enough for gaming. More helps with video editing, streaming and heavy mods.','{n} Go n\'apportent pas de FPS en plus ; 32 Go suffisent pour jouer. Au-delà : montage, streaming, mods lourds.','{n} GB no dan más FPS en juegos; 32 GB bastan. Más memoria ayuda en edición, streaming y mods pesados.','{n} GB non danno FPS in più nei giochi; 32 GB bastano. Di più serve per editing, streaming e mod pesanti.','{n} GB bringen in Spielen keine zusätzlichen FPS; 32 GB reichen. Mehr hilft bei Videoschnitt, Streaming und großen Mods.','{n} ГБ не дают прироста FPS в играх; для игр хватает 32 ГБ. Больше пригодится для монтажа, стримов и тяжёлых модов.','{n}GB 不会带来额外帧率，游戏 32GB 已足够；更多内存适合剪辑、直播和大型模组。','{n} GB não dão FPS extra em jogos; 32 GB bastam. Mais memória ajuda em edição, streaming e mods pesados.'],
  rtOnly5:['Bu işlemci yalnızca DDR5 destekler. DDR4 seçenekleri Ryzen 5000 ve öncesi ile Intel 6.–14. nesil işlemcilerde görünür.','This CPU supports DDR5 only. DDR4 options appear for Ryzen 5000 and older and Intel 6th–14th gen.','Ce processeur ne prend en charge que la DDR5. La DDR4 apparaît pour Ryzen 5000 et antérieurs et Intel 6e–14e gén.','Este procesador solo admite DDR5. Las opciones DDR4 aparecen con Ryzen 5000 o anteriores e Intel de 6.ª a 14.ª gen.','Questa CPU supporta solo DDR5. Le opzioni DDR4 compaiono con Ryzen 5000 e precedenti e Intel dalla 6ª alla 14ª gen.','Diese CPU unterstützt nur DDR5. DDR4 erscheint bei Ryzen 5000 und älter sowie Intel der 6.–14. Gen.','Этот процессор поддерживает только DDR5. DDR4 доступна для Ryzen 5000 и старше, а также Intel 6–14 поколений.','该处理器仅支持 DDR5。选择 Ryzen 5000 及更早型号或英特尔第 6–14 代时会显示 DDR4 选项。','Este processador só aceita DDR5. As opções DDR4 aparecem para Ryzen 5000 ou anteriores e Intel de 6ª a 14ª ger.'],
  rtOnly4:['Bu işlemci yalnızca DDR4 destekler.','This CPU supports DDR4 only.','Ce processeur ne prend en charge que la DDR4.','Este procesador solo admite DDR4.','Questa CPU supporta solo DDR4.','Diese CPU unterstützt nur DDR4.','Этот процессор поддерживает только DDR4.','该处理器仅支持 DDR4。','Este processador só aceita DDR4.'],
  rtBoth:['Intel 12.–14. nesil anakarta göre DDR4 ya da DDR5 kullanabilir. DDR5-6000, DDR4-3600\'a göre oyunlarda yaklaşık %10 daha hızlı.','Intel 12th–14th gen can use DDR4 or DDR5 depending on the motherboard. DDR5-6000 is about 10% faster than DDR4-3600 in games.','Les Intel 12e–14e gén. acceptent DDR4 ou DDR5 selon la carte mère. La DDR5-6000 est environ 10 % plus rapide que la DDR4-3600 en jeu.','Intel de 12.ª a 14.ª gen puede usar DDR4 o DDR5 según la placa. DDR5-6000 es ~10 % más rápida que DDR4-3600 en juegos.','Intel 12ª–14ª gen usa DDR4 o DDR5 a seconda della scheda madre. La DDR5-6000 è circa il 10% più veloce della DDR4-3600 nei giochi.','Intel 12.–14. Gen. nutzt je nach Mainboard DDR4 oder DDR5. DDR5-6000 ist in Spielen etwa 10 % schneller als DDR4-3600.','Intel 12–14 поколений работает с DDR4 или DDR5 в зависимости от платы. DDR5-6000 быстрее DDR4-3600 в играх примерно на 10%.','英特尔第 12–14 代可根据主板使用 DDR4 或 DDR5。游戏中 DDR5-6000 比 DDR4-3600 快约 10%。','Intel de 12ª a 14ª ger. usa DDR4 ou DDR5 conforme a placa-mãe. DDR5-6000 é cerca de 10% mais rápida que DDR4-3600 em jogos.'],
  rtAM4:['En verimli bellek DDR4-3600 CL16. 3800 en üst sınır; 4000 ve üstünde işlemcinin iç bağlantısı yavaşladığı için daha hızlı olmaz.','Best value is DDR4-3600 CL16. 3800 is the ceiling; at 4000 and above the CPU\'s internal link slows down, so it\'s no faster.','Idéal : DDR4-3600 CL16. 3800 est le plafond ; à 4000 et plus, le lien interne du processeur ralentit, donc aucun gain.','Lo ideal es DDR4-3600 CL16. 3800 es el techo; a 4000 o más el enlace interno del procesador se ralentiza y no gana.','Ideale DDR4-3600 CL16. 3800 è il limite; da 4000 in su il collegamento interno della CPU rallenta e non si guadagna.','Ideal ist DDR4-3600 CL16. 3800 ist das Maximum; ab 4000 wird die interne CPU-Verbindung langsamer, also kein Gewinn.','Оптимально DDR4-3600 CL16. 3800 — предел; на 4000 и выше внутренняя шина процессора замедляется, прироста нет.','最佳选择为 DDR4-3600 CL16。3800 为上限；4000 及以上时处理器内部总线降频，不会更快。','O ideal é DDR4-3600 CL16. 3800 é o teto; a partir de 4000 o link interno do processador desacelera e não há ganho.'],
  rtD4Gear:['DDR4 için en verimli seçim 3600 CL16. 4000 ve üstü çoğu sistemde "Gear 2" moduna geçtiği için 3600\'dan hızlı değil.','With DDR4, 3600 CL16 is the best value. 4000 and above usually switch to "Gear 2", so they are no faster than 3600.','En DDR4, la 3600 CL16 est le meilleur choix. À 4000 et plus, le mode « Gear 2 » s\'active souvent : pas plus rapide que 3600.','Con DDR4, 3600 CL16 es lo ideal. A 4000 o más suele activarse el modo "Gear 2" y no es más rápida que 3600.','Con DDR4 la scelta migliore è 3600 CL16. Da 4000 in su di solito si passa a "Gear 2", quindi non è più veloce.','Bei DDR4 ist 3600 CL16 ideal. Ab 4000 schalten die meisten Systeme auf „Gear 2“, daher nicht schneller als 3600.','Для DDR4 оптимальна 3600 CL16. На 4000 и выше обычно включается режим «Gear 2», поэтому быстрее 3600 не будет.','DDR4 最佳选择为 3600 CL16。4000 及以上通常切换到“Gear 2”模式，并不比 3600 更快。','Com DDR4, 3600 CL16 é o ideal. A partir de 4000 costuma entrar o modo "Gear 2", então não é mais rápida que 3600.'],
  rtX3D4:['{c} büyük önbelleği sayesinde bellek hızına az duyarlı: DDR4-3200 ile 3800 arasındaki fark oyunlarda %1-2 civarı.','{c} has a big cache, so memory speed matters little: DDR4-3200 vs 3800 is about 1-2% in games.','Grâce à son grand cache, le {c} est peu sensible à la mémoire : environ 1-2 % entre DDR4-3200 et 3800 en jeu.','Gracias a su gran caché, el {c} es poco sensible a la memoria: 1-2 % entre DDR4-3200 y 3800 en juegos.','Grazie alla grande cache, il {c} è poco sensibile alla memoria: circa 1-2% tra DDR4-3200 e 3800 nei giochi.','Dank großem Cache ist der {c} kaum speicherabhängig: DDR4-3200 vs. 3800 ≈ 1–2 % in Spielen.','Благодаря большому кэшу {c} мало зависит от памяти: DDR4-3200 и 3800 различаются в играх на 1–2%.','{c} 拥有大缓存，对内存速度不敏感：游戏中 DDR4-3200 与 3800 仅相差 1-2%。','Graças ao grande cache, o {c} depende pouco da memória: cerca de 1-2% entre DDR4-3200 e 3800 em jogos.'],

  // tech descriptions
  d_dlss45n:['2. nesil Transformer (Model M/L). En iyi görüntü. RTX 40/50 FP8 desteği sayesinde maliyeti sadece %2-3.','2nd-gen Transformer (Model M/L). Best image. Only a 2-3% cost on RTX 40/50 thanks to FP8.','Transformer 2e génération (Modèle M/L). Meilleure image. Coût de 2-3 % seulement sur RTX 40/50 grâce au FP8.','Transformer de 2.ª generación (Modelo M/L). La mejor imagen. Solo un 2-3% de coste en RTX 40/50 gracias a FP8.','Transformer di 2ª generazione (Modello M/L). Immagine migliore. Costo di appena 2-3% su RTX 40/50 grazie a FP8.','Transformer der 2. Generation (Modell M/L). Bestes Bild. Dank FP8 nur 2-3 % Kosten auf RTX 40/50.','Трансформер 2-го поколения (модель M/L). Лучшая картинка. На RTX 40/50 благодаря FP8 стоит всего 2-3%.','第二代 Transformer（模型 M/L）。画质最佳。得益于 FP8，RTX 40/50 上仅损失 2-3%。','Transformer de 2ª geração (Modelo M/L). Melhor imagem. Custo de só 2-3% na RTX 40/50 graças ao FP8.'],
  d_dlss45o:['2. nesil Transformer (Model M/L). RTX 20/30 FP8 desteklemediği için %10-20 ek maliyet ve daha fazla VRAM. Çoğu durumda DLSS 4 daha mantıklı.','2nd-gen Transformer (Model M/L). RTX 20/30 lack FP8, so expect a 10-20% extra cost and more VRAM. DLSS 4 is usually smarter.','Transformer 2e génération. Les RTX 20/30 n\'ont pas le FP8 : 10-20 % de coût en plus et plus de VRAM. DLSS 4 est souvent plus judicieux.','Transformer de 2.ª generación. Las RTX 20/30 no tienen FP8: 10-20% de coste extra y más VRAM. DLSS 4 suele convenir más.','Transformer di 2ª generazione. Le RTX 20/30 non hanno FP8: 10-20% di costo in più e più VRAM. Spesso meglio il DLSS 4.','Transformer der 2. Generation. RTX 20/30 fehlt FP8: 10-20 % Mehrkosten und mehr VRAM. DLSS 4 ist meist sinnvoller.','Трансформер 2-го поколения. У RTX 20/30 нет FP8: +10-20% нагрузки и больше VRAM. Обычно разумнее DLSS 4.','第二代 Transformer。RTX 20/30 不支持 FP8，额外损失 10-20% 且占用更多显存。多数情况下 DLSS 4 更合适。','Transformer de 2ª geração. RTX 20/30 não têm FP8: 10-20% de custo extra e mais VRAM. O DLSS 4 costuma valer mais.'],
  d_dlss4:['1. nesil Transformer (Model K). Tüm RTX kartlarda hızlı ve keskin. RTX 20/30 için önerilen.','1st-gen Transformer (Model K). Fast and sharp on every RTX card. Recommended for RTX 20/30.','Transformer 1re génération (Modèle K). Rapide et net sur toutes les RTX. Conseillé pour RTX 20/30.','Transformer de 1.ª generación (Modelo K). Rápido y nítido en todas las RTX. Recomendado para RTX 20/30.','Transformer di 1ª generazione (Modello K). Veloce e nitido su tutte le RTX. Consigliato per RTX 20/30.','Transformer der 1. Generation (Modell K). Schnell und scharf auf jeder RTX. Empfohlen für RTX 20/30.','Трансформер 1-го поколения (модель K). Быстрый и чёткий на всех RTX. Рекомендуется для RTX 20/30.','第一代 Transformer（模型 K）。所有 RTX 显卡上都快速清晰，推荐 RTX 20/30 使用。','Transformer de 1ª geração (Modelo K). Rápido e nítido em toda RTX. Recomendado para RTX 20/30.'],
  d_dlss3:['Eski CNN modeli. Hızlı ama hareketli sahnelerde daha bulanık ve izli.','Older CNN model. Fast, but blurrier with more ghosting in motion.','Ancien modèle CNN. Rapide mais plus flou avec des traînées en mouvement.','Modelo CNN antiguo. Rápido, pero más borroso y con estelas en movimiento.','Vecchio modello CNN. Veloce ma più sfocato e con scie in movimento.','Älteres CNN-Modell. Schnell, aber in Bewegung unschärfer mit Schlieren.','Старая CNN-модель. Быстрая, но в движении мыльнее и со шлейфами.','旧版 CNN 模型。速度快，但动态画面更模糊、拖影更多。','Modelo CNN antigo. Rápido, mas mais borrado e com rastros em movimento.'],
  d_fsr4:['Yapay zekâ tabanlı (Redstone). Sadece RX 9000 serisi. FSR 3.1\'den çok daha temiz görüntü.','AI-based (Redstone). RX 9000 only. Much cleaner than FSR 3.1.','Basé sur l\'IA (Redstone). RX 9000 uniquement. Bien plus propre que FSR 3.1.','Basado en IA (Redstone). Solo RX 9000. Mucho más limpio que FSR 3.1.','Basato su IA (Redstone). Solo RX 9000. Molto più pulito di FSR 3.1.','KI-basiert (Redstone). Nur RX 9000. Deutlich sauberer als FSR 3.1.','На базе ИИ (Redstone). Только RX 9000. Намного чище FSR 3.1.','基于 AI（Redstone），仅限 RX 9000，画面远比 FSR 3.1 干净。','Baseado em IA (Redstone). Só RX 9000. Bem mais limpo que o FSR 3.1.'],
  d_fsr41:['Temmuz 2026\'dan beri RX 7000 serisinde. INT8 ile çalışan yapay zekâ modeli; FSR 4\'ten biraz daha ağır.','On RX 7000 since July 2026. An INT8 AI model, a bit heavier than FSR 4.','Sur RX 7000 depuis juillet 2026. Modèle IA en INT8, un peu plus lourd que FSR 4.','En RX 7000 desde julio de 2026. Modelo de IA en INT8, algo más pesado que FSR 4.','Su RX 7000 da luglio 2026. Modello IA INT8, un po\' più pesante di FSR 4.','Seit Juli 2026 auf RX 7000. INT8-KI-Modell, etwas schwerer als FSR 4.','На RX 7000 с июля 2026. ИИ-модель на INT8, чуть тяжелее FSR 4.','2026 年 7 月起登陆 RX 7000。INT8 AI 模型，比 FSR 4 略重。','Na RX 7000 desde julho de 2026. Modelo de IA em INT8, um pouco mais pesado que o FSR 4.'],
  d_xess:['Intel Arc\'ta XMX çekirdekleriyle tam kalite çalışır.','Runs at full quality on Intel Arc using XMX cores.','Qualité maximale sur Intel Arc grâce aux cœurs XMX.','Calidad completa en Intel Arc con núcleos XMX.','Qualità piena su Intel Arc con i core XMX.','Volle Qualität auf Intel Arc mit XMX-Kernen.','На Intel Arc работает в полном качестве на ядрах XMX.','在 Intel Arc 上借助 XMX 核心以完整画质运行。','Qualidade total na Intel Arc com núcleos XMX.'],
  d_fsr31:['Her kartta çalışır, yapay zekâ kullanmaz. Düşük modlarda titreme ve bulanıklık belirgin.','Works on every card, no AI. Shimmering and blur are noticeable in lower modes.','Fonctionne partout, sans IA. Scintillement et flou visibles en modes bas.','Funciona en todas las tarjetas, sin IA. Parpadeo y desenfoque visibles en modos bajos.','Funziona ovunque, senza IA. Sfarfallio e sfocatura evidenti nei modi bassi.','Läuft auf jeder Karte, ohne KI. Flimmern und Unschärfe in niedrigen Modi.','Работает на любой карте, без ИИ. В низких режимах заметны мерцание и мыло.','所有显卡可用，不使用 AI。低档模式下闪烁和模糊明显。','Funciona em qualquer placa, sem IA. Cintilação e borrão visíveis nos modos baixos.'],
  d_fsr31b:[' RX 6000 serisine FSR 4.1 desteği 2027 başında bekleniyor.',' FSR 4.1 is expected on RX 6000 in early 2027.',' FSR 4.1 est attendu sur RX 6000 début 2027.',' Se espera FSR 4.1 en RX 6000 a principios de 2027.',' FSR 4.1 è atteso su RX 6000 a inizio 2027.',' FSR 4.1 wird Anfang 2027 für RX 6000 erwartet.',' FSR 4.1 для RX 6000 ожидается в начале 2027.',' RX 6000 预计在 2027 年初获得 FSR 4.1。',' O FSR 4.1 é esperado na RX 6000 no início de 2027.'],

  if (g.includes('RX 7000')) out.push({id:'fsr41', name:'FSR 4.1', aa:'Yerel AA', q:.92, over:.92, vram:.3, d:'d_fsr41'});
  if (g.startsWith('Intel')) out.push({id:'xess', name:'XeSS 2', aa:'Yerel AA', q:.95, over:.97, vram:.2, d:'d_xess'});

  const col = hit?'var(--green)':'var(--red)';
  const [tx0,ty0]=pt(ang(target),R-14),[tx1,ty1]=pt(ang(target),R+12),[ux,uy]=pt(ang(ultra)),[nx,ny]=pt(ang(fps),R-26);

    <path d="${arc(a0,ang(fps))}" fill="none" stroke="${col}" stroke-width="13"/>

/* ---------- Render ---------- */
let lastText='';

function ramTip(ctx){
  const el = $('ramTip'); if (!el) return;
  if (st.dev==='hh'){ el.style.display='none'; return; }
  const cpuN = $('cpu').value, rk = $('ramType').value || '', amt = +$('ramAmt').value, lines = [];
  const igpu = st.dev==='lap' && /iGPU|Radeon [678][0-9]0M|Radeon Vega|Iris|8060S|8050S/.test((gpuMap[$('gpu').value]||{}).grp+' '+$('gpu').value) && !/RX /.test($('gpu').value);
  const plat = ramPlatform(cpuN, st.dev==='lap');
  if (st.dev==='desk'){
    if (plat.kind==='d5') lines.push(t('rtOnly5'));
    else if (plat.kind==='d4') lines.push(t('rtOnly4'));
    else lines.push(t('rtBoth'));
  }
  if (igpu) lines.push(t('rtIGPU'));
  else if (/X3D/.test(cpuN)) lines.push(t(rk.startsWith('d4') ? 'rtX3D4' : 'rtX3D',{c:cpuN}));
  else if (rk.startsWith('d4') && plat.plat==='am4') lines.push(t('rtAM4'));
  else if (rk.startsWith('d4') && plat.plat==='lga1700') lines.push(t('rtD4Gear'));
  else if (rk.startsWith('d4')) lines.push(t('rtDDR4'));
  else if (/Ryzen/.test(cpuN) && st.dev==='desk') lines.push(t('rtAM5'));
  else if (st.dev==='desk') lines.push(t('rtIntel'));
  if (st.dev==='lap') lines.push(t('rtLap'));
  if (amt===16) lines.push(t('rt16'));
  if (amt>=64) lines.push(t('rtBig',{n:amt}));
  el.style.display = lines.length ? '' : 'none';
  el.innerHTML = lines.join('<br>');
}

function run(){
  saveSys();
  let ctx = buildCtx(); const target = st.target;
  ramTip(ctx);
  const bNew = (st.dev==='hh' && hhBrand(HANDHELDS[st.hh].n)) || brandOf(ctx.gpu.grp); if (bNew !== brandNow) applyBrand(bNew);
  if (st.dev==='hh'){ const h=HANDHELDS[st.hh]; $('hhInfo').textContent = t('hhInfo',{r:RES[h.res].name, m:h.vram, w:h.pw[st.hhPwr][1]}); }
  const rtAvail = ctx.game.rt && ctx.gpu.rt>0;
  $('rtTog').classList.toggle('dis', !rtAvail);
  $('rtSub').textContent = !ctx.game.rt ? t('rtNone') : ctx.gpu.rt===0 ? t('rtNoGpu') : t('rtCost');

  if (ctx.game.req && ctx.gpu.rt===0){
    renderHud(`<div class="vt" style="grid-column:1/-1"><div class="st no">${t('noRun',{g:ctx.game.n})}</div><p>${t('noRunP')}</p></div>`, target);
    $('pSet').innerHTML=''; $('pTech').innerHTML=''; $('sysOut').innerHTML=''; return;
  }

  let pick = optimize(ctx, target);
  if (ctx.cine && ctx.game.rt && ctx.gpu.rt>0 && !ctx.rtOn){
    const c2 = buildCtx({rt:true}); const p2 = optimize(c2, target);
    if (p2.hit && p2.vis - 6 < pick.vis){ ctx = c2; pick = p2; ctx.rtAuto = true; }
    else { ctx.fg = pick.fg; ctx.target = target; }
  }
  const cfg = pick.cfg, r = pick.r;
  const hit = pick.hit, final = Math.round(ctx.fg && ctx.fg.dyn && hit ? target : pick.shownFps);
  const ultraFps = Math.round(evalCfg({...ctx, fg:null}, {lv:ctx.settings.map(()=>0), up:1}).fps);
  const lowR = evalCfg(ctx, {lv:ctx.settings.map((s,i)=>locks[i]??s.lv.length-1), up: !ctx.upOk?1: modeLocked()? MODES.findIndex(m=>m.id===st.mode) : MODES.length-1});
  const nLocks = Object.keys(locks).length;
  const techName = ctx.tech.name;

  const gains=[];

  if (ctx.upOk && cfg.up>=2){ const c={lv:[...cfg.lv],up:1}; gains.push({i:'up',n:techName+' '+modeName(cfg.up),g:(r.fps/evalCfg(ctx,c).fps-1)*100}); }
  const top = [...gains].sort((a,b)=>b.g-a.g)[0];

  else if (hit){ stT=`<div class="st ok">${t('hit')}</div>`; stP=t('maxWas',{u:ultraFps}) + (top ? t('bigGain',{n:top.n,g:pct(Math.round(top.g))}) : ''); }
  else { stT=`<div class="st no">${t('miss')}</div>`; stP=t('maxReach',{x:Math.round(shown(ctx,lowR.fps))}); }
  const sub = [];

  if (ctx.fg) sub.push(ctx.fg.dyn ? t('dynMfg',{m:fgMult(ctx,r.fps).toFixed(1)}) : t('fgK',{k:ctx.fg.id}));
  renderHud(`${gauge(final,target,ultraFps,hit)}<div class="vt">${stT}<p>${stP}</p><p style="color:var(--cyan)">${sub.join(' · ')}</p></div>`, target);

  // --- settings pane
