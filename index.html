    profHtml = `<div class="cinesum"><b>${t('cineSum',{t:target})}</b><ul>${items.map(x=>`<li>${x}</li>`).join('')}</ul></div><p class="info" style="margin-bottom:10px">${t('cineInfo')}</p>`;
  }
  const vend = ctx.gpu.grp.startsWith('NVIDIA') && ctx.gpu.rt>0 ? t('tipNv') : ctx.gpu.grp.startsWith('AMD') ? t('tipAmd') : ctx.gpu.grp.startsWith('Intel') ? t('tipIntel') : t('tipNv');
  const tipsHtml = ctx.comp ? `<h2 class="ph">${t('tipsTitle')}</h2><p class="info">${vend}<br>${t('tipVsync')}<br>${t('tipCap',{x:Math.max(30,target-3)})}${target>=240?'<br>'+t('tipCpuHigh'):''}</p>` : '';
  $('pSet').innerHTML = `${profHtml}<h2 class="ph">${t('gfx')}</h2>
    <div class="mh"><p>${UE5_SET.has(ctx.game.n)?t('ue5menu'):PROFILES[ctx.game.n]?t('menuOrder'):t('generic')}${t('tapLock')}</p><div class="mb">${nLocks?`<button id="unlockBtn">${t('unlock')} (${nLocks})</button>`:''}<button id="copyBtn">${t('copy')}</button></div></div>
    ${ctx.settings.map((s,i)=>pipRow(i,s,cfg.lv[i],locks[i]!==undefined,gains.find(x=>x.i===i))).join('')}${tipsHtml}`;
  $('pSet').querySelectorAll('.pips button').forEach(b=>b.onclick=()=>{ const i=+b.dataset.k,l=+b.dataset.l; if(locks[i]===l) delete locks[i]; else locks[i]=l; run(); });
  const ub=$('unlockBtn'); if(ub) ub.onclick=()=>{ locks={}; run(); };
  $('copyBtn').onclick=async()=>{ try{ await navigator.clipboard.writeText(lastText); toast(t('copied')); }catch(e){ toast(t('copyFail')); } };

  // --- tech pane
  const rh = {720:[1280,720],800:[1280,800],1080:[1920,1080],1200:[1920,1200],1440:[2560,1440],1600:[2560,1600],2160:[3840,2160]}[st.res];
  const internal = m => `${Math.round(rh[0]*MODES[m].scale)}×${Math.round(rh[1]*MODES[m].scale)}`;
  const modeBtns = ['auto',...MODES.map(m=>m.id)].map(id=>{
    const label = id==='auto' ? t('auto') : id==='aa' ? tr(ctx.tech.aa) : tr(MODES.find(m=>m.id===id).name);
    return `<button data-m="${id}" class="${st.mode===id?'on':''}">${label}</button>`;
  }).join('');
  let fgHtml = '';
  if (ctx.fgOk){
    const fi = ctx.fgInfo, opts = [{id:'off',l:t('off')},{id:'auto',l:t('auto')},...fi.opts.map(o=>({id:o.id,l:o.dyn?t('dynamic'):o.label+(o.unofficial?'*':'')}))];
    const m = ctx.fg ? fgMult(ctx, r.fps) : 1;
    let how = '';
    if (fi.mfg){
      how = fi.sup.t==='mfg' ? t('mfgNative') : t('mfgOverride');
      if (!fi.sup.six) how += t('six');
    }
    let dynInfo = '';
    if (ctx.fg && ctx.fg.dyn) dynInfo = `<p class="info"><b>${t('dynLabel')}</b> ${t('dynText',{max:ctx.fg.max,t:target,m:m.toFixed(1)})}${fi.sup.dyn==='native' ? t('dynNative') : t('dynApp')}</p>`;
    fgHtml = `<h2 class="ph">${fi.mfg ? t('mfgTitle') : t('fgTitle')}</h2><div class="seg" id="fgSeg">${opts.map(o=>`<button data-f="${o.id}" class="${st.fg===o.id?'on':''}">${o.l}</button>`).join('')}</div>
      <p class="info"><b>${t(fi.tech)}.</b> ${ctx.fg ? t('realFps',{r:Math.round(r.fps),f:final,k:ctx.fg.dyn?t('dynamic'):ctx.fg.id+'x'}) : ''}${how} ${t('latency')}</p>${dynInfo}`;
  } else if (ctx.comp && FGSUP[ctx.game.n]) fgHtml = `<h2 class="ph">${t('fgTitle')}</h2><p class="info">${t('fgCompOff')}</p>`;

  const tS=$('techSeg'); if(tS) tS.onclick=e=>{const b=e.target.closest('button'); if(b){st.tech=b.dataset.t; run();}};
  const mS=$('modeSeg'); if(mS) mS.onclick=e=>{const b=e.target.closest('button'); if(b){st.mode=b.dataset.m; run();}};
  const fS=$('fgSeg'); if(fS) fS.onclick=e=>{const b=e.target.closest('button'); if(b){st.fg=b.dataset.f; run();}};

  // --- system extras
  const chips=[`<span class="chip">${t('bottleneck',{x:r.cpuBound?t('cpu'):t('gpu')})}</span>`,`<span class="chip">VRAM ~${Math.min(r.need,99).toFixed(1)} / ${ctx.gpu.vram} GB</span>`];
  if (ctx.rtOn) chips.push(`<span class="chip hl">${t('rtOnChip')}</span>`);
  if (nLocks) chips.push(`<span class="chip hl">${t('nLocked',{n:nLocks})}</span>`);
  const warns=[];
  if (!hit && lowR.cpuBound) warns.push(t('wCpu',{x:Math.round(lowR.cf)}));
  else if (!hit) warns.push(t('wGpu') + (!['720','1080'].includes(st.res)?t('wRes'):t('wLow')) + (nLocks||modeLocked()?t('wLocks'):'') + (st.fg==='off'&&ctx.fgOk?t('wFg'):''));
  if (r.vramShort) warns.push(t('wVram',{v:ctx.gpu.vram}));
  if (ctx.fg && r.fps<55) warns.push(t('wFgLat',{r:Math.round(r.fps)}));
  if (ctx.game.cap && target>ctx.game.cap) warns.push(t('wCap',{g:ctx.game.n,c:ctx.game.cap}));
  if (ctx.amt===8) warns.push(t('w8gb'));
  if (ctx.tech.id==='dlss45' && !/RTX (40|50)/.test(ctx.gpu.grp) && cfg.up!==1) warns.push(t('wDlssOld'));
  const d = ctx.drv;
  if (d.legacy) warns.push(t('drvLegacy'));
  const drvHtml = d.steamos ? `<h2 class="ph">${t('drvTitle')}</h2><p class="info"><b>SteamOS</b><br>${t('steamos')}</p>` : `<h2 class="ph">${t('drvTitle')}</h2><p class="info"><b>${d.name} ${d.ver}</b>${d.date?`<br>${t('drvRel',{d:fmtDate(d.date)})}`:''}${d.whql?t('drvOpt',{w:d.whql}):''}<br>${t('drvBasis')}${d.games && d.games.includes(ctx.game.n)?`<br><span style="color:var(--green)">${t('drvReady',{g:ctx.game.n})}</span>`:''}</p><p class="foot">${t('drvData',{d:fmtDate(DRIVERS.checked)})}</p>`;
  $('sysOut').innerHTML = `${drvHtml}<div class="chips">${chips.join('')}</div>${warns.map(w=>`<div class="warn">${w}</div>`).join('')}`;
  $('tabs').querySelector('[data-p="pSys"] span').textContent = warns.length ? t('sysWarn',{n:warns.length}) : t('tabSys');

  lastText = `${ctx.game.n} | ${st.dev==='hh' ? ctx.devName : $('gpu').value+' + '+$('cpu').value} | ${RES[st.res].name} · ${t('copyTarget')} ${target} → ~${final} FPS\n`
    + (ctx.upOk?`${techName}: ${cfg.up===1?t('off'):modeName(cfg.up)}\n`:'')
    + (ctx.fg?`${t('fgCopy')}: ${ctx.fg.dyn?t('dynamic'):ctx.fg.id+'x'}\n`:'')
    + ctx.settings.map((s,i)=>`${tr(s.n)}: ${tr(s.lv[cfg.lv[i]])}`).join('\n');
}

const TOUR = [
  {h:'t1h', p:'t1', el:()=>null},
  {h:'t2h', p:'t2', el:()=>[$('game').closest('.top')]},
  {h:'t3h', p:'t3', el:()=>[$('hud').querySelector('.tg'), $('hz')]},

  {h:'t8h', p:'t8', el:()=>[$('gearBtn')]},
  {h:'t9h', p:'t9', el:()=>null}
];
let tourI = -1;
function tourRect(els){
  const rs = els.filter(e=>e && e.getClientRects().length).map(e=>e.getBoundingClientRect());
  if (!rs.length) return null;
  const l=Math.min(...rs.map(r=>r.left)), t_=Math.min(...rs.map(r=>r.top)), r=Math.max(...rs.map(r=>r.right)), b=Math.max(...rs.map(r=>r.bottom));
  return {left:l-6, top:t_-6, width:r-l+12, height:b-t_+12};
}
function tourPlace(){
  if (tourI<0) return;
  const step = TOUR[tourI], els = step.el(), spot=$('tourSpot'), pop=$('tourPop');
  const vw = innerWidth, vh = innerHeight;
  if (els && els[0]) els[0].scrollIntoView({block:'nearest', inline:'nearest'});
  const r = els ? tourRect(els) : null;
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  if (!r){
    spot.className='tour-spot center'; spot.style.cssText='';
    pop.style.left = Math.max(12,(vw-pw)/2)+'px'; pop.style.top = Math.max(12,(vh-ph)/2)+'px'; return;
  }
  spot.className='tour-spot';
  spot.style.left=Math.max(4,r.left)+'px'; spot.style.top=Math.max(4,r.top)+'px';
  spot.style.width=Math.min(vw-8,r.width)+'px'; spot.style.height=Math.min(vh-8,r.height)+'px';
  let top;
  if (r.top + r.height + 10 + ph <= vh - 8) top = r.top + r.height + 10;
  else if (r.top - 10 - ph >= 8) top = r.top - 10 - ph;
  else top = vh - ph - 12;
  let left = r.left + r.width/2 - pw/2;
  left = Math.max(12, Math.min(vw - pw - 12, left));
  pop.style.left = left+'px'; pop.style.top = Math.max(8,top)+'px';
}
function tourShow(i){
  tourI = i; const step = TOUR[i];
  if (step.pre) step.pre();
  $('tourH').textContent = t(step.h); $('tourP').textContent = t(step.p);
  $('tourCnt').textContent = (i+1)+' / '+TOUR.length;
  $('tourDots').innerHTML = TOUR.map((_,k)=>`<i class="${k<=i?'on':''}"></i>`).join('');
  $('tourSkip').textContent = t('tSkip'); $('tourBack').textContent = t('tBack');
  $('tourNext').textContent = i===TOUR.length-1 ? t('tStart') : t('tNext');
  $('tourSkip').style.display = i===TOUR.length-1 ? 'none' : '';
  $('tourBack').style.display = i===0 ? 'none' : '';
  requestAnimationFrame(()=>{ tourPlace(); $('tourNext').focus({preventScroll:true}); });
}
function tourStart(){ $('sheetBg').classList.remove('on'); $('tour').hidden = false; tourShow(0); }
function tourEnd(){
  $('tour').hidden = true; tourI = -1; showTab('pSet');
  try { localStorage.setItem(TOUR_KEY,'1'); } catch(e){}
}
$('tourNext').onclick = () => tourI < TOUR.length-1 ? tourShow(tourI+1) : tourEnd();
$('tourBack').onclick = () => tourI > 0 && tourShow(tourI-1);
$('tourSkip').onclick = tourEnd;
$('replayBtn').onclick = tourStart;
addEventListener('resize', () => { if (tourI>=0) tourPlace(); });
document.addEventListener('keydown', e => {
  if (tourI<0) return;
  if (e.key==='Escape') { e.stopPropagation(); tourEnd(); }
  else if (e.key==='ArrowRight') $('tourNext').click();
  else if (e.key==='ArrowLeft') $('tourBack').click();
}, true);
let tourSeen = false;
try { tourSeen = localStorage.getItem(TOUR_KEY)==='1'; } catch(e){}
if (!tourSeen) setTimeout(tourStart, 450);
})();

</script>
<script>
/* Service worker: internetsiz çalışma + "Yeni sürüm hazır" bildirimi */
if ('serviceWorker' in navigator) addEventListener('load', async () => {
  try {
    const reg = await navigator.serviceWorker.register('sw.js');
    const notify = w => { if (navigator.serviceWorker.controller && window.hfpsUpdate) window.hfpsUpdate(w); };
    if (reg.waiting) notify(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      if (w) w.addEventListener('statechange', () => { if (w.state === 'installed') notify(w); });
    });
    let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (!reloading) { reloading = true; location.reload(); } });
    setInterval(() => reg.update().catch(()=>{}), 30 * 60 * 1000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(()=>{}); });
  } catch (e) {}
});
</script>
